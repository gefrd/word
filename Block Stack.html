<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="created-date" content="2026-03-25">
    <meta name="game-engine" content="threejs">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .game-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }
        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px 0;
            color: #fff;
        }
        .game-info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
        }
        .game-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin: 8px 0 0 0;
            line-height: 1.4;
        }
        .game-engine {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 8px;
            text-transform: uppercase;
            font-weight: 500;
        }
        #gameContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }
        canvas {
            display: block;
            margin: 0 auto;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        body > canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .ludo-footer {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            text-decoration: none;
            border-top-left-radius: 4px;
            transition: all 0.2s ease;
            z-index: 1000;
        }
        .ludo-footer:hover {
            background: rgba(0, 0, 0, 0.9);
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <script type="importmap" crossorigin="anonymous">{"imports": {"three": "https://unpkg.com/three@0.176.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.176.0/examples/jsm/"}}</script>
    <script type="module">

        // Engine: threejs
        // Title: Block Stack
        
        // Monitor for canvas elements and move them to gameContainer
        const gameContainer = document.getElementById('gameContainer');
        
        // Function to move canvas elements to gameContainer
        function moveCanvasToContainer() {
            const canvases = document.querySelectorAll('body > canvas');
            canvases.forEach(canvas => {
                if (canvas.parentElement === document.body) {
                    gameContainer.appendChild(canvas);
                }
            });
        }
        
        // Monitor for new canvas elements
        const observer = new MutationObserver(() => {
            moveCanvasToContainer();
        });
        observer.observe(document.body, { childList: true });
        
        // Initial check
        setTimeout(moveCanvasToContainer, 100);
        
        import * as THREE from 'three';

const GAME_STATE_PLAYING = 0;
const GAME_STATE_GAMEOVER = 1;

const BLOCK_HEIGHT = 2;
const INITIAL_BLOCK_SIZE = 10;
const INITIAL_SPEED = 0.12;
const SPEED_INCREMENT = 0.025;
const SPEED_INCREASE_EVERY = 8;
const PERFECT_EPSILON = 0.05;
const MAX_COMEBACK_SIZE = 10;
const STREAK_FOR_COMEBACK = 3;
const CAMERA_OFFSET_Y = 18;
const CAMERA_OFFSET_Z = 22;

let renderer, scene, camera, ambientLight, dirLight;
let blocks = [];
let cutPieces = [];
let activeBlock = null;
let lastBlock = null;
let direction = 1;
let moveAxis = 'x';
let blockSpeed = INITIAL_SPEED;
let score = 0;
let highScore = 0;
let gameState = GAME_STATE_PLAYING;
let perfectStreak = 0;
let flashMesh = null;
let flashTimer = 0;
let backgroundColor = new THREE.Color();
let baseHue = 170;
let topHue = 320;

const scoreDiv = document.createElement('div');
scoreDiv.style.position = 'absolute';
scoreDiv.style.top = '32px';
scoreDiv.style.width = '100%';
scoreDiv.style.textAlign = 'center';
scoreDiv.style.fontFamily = 'Arial, sans-serif';
scoreDiv.style.fontSize = '48px';
scoreDiv.style.fontWeight = 'bold';
scoreDiv.style.color = '#fff';
scoreDiv.style.textShadow = '0 2px 8px #000a';
scoreDiv.style.pointerEvents = 'none';
document.body.appendChild(scoreDiv);

const gameOverDiv = document.createElement('div');
gameOverDiv.style.position = 'absolute';
gameOverDiv.style.top = '45%';
gameOverDiv.style.width = '100%';
gameOverDiv.style.textAlign = 'center';
gameOverDiv.style.fontFamily = 'Arial, sans-serif';
gameOverDiv.style.fontSize = '36px';
gameOverDiv.style.color = '#fff';
gameOverDiv.style.textShadow = '0 2px 8px #000a';
gameOverDiv.style.display = 'none';
gameOverDiv.style.pointerEvents = 'none';
document.body.appendChild(gameOverDiv);

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function getGradientColor(t) {
    const h = lerp(baseHue, topHue, t);
    backgroundColor.setHSL(h / 360, 0.55, 0.65);
    return backgroundColor.getStyle();
}

function createBlock(width, depth, y, color, x = 0, z = 0) {
    const geometry = new THREE.BoxGeometry(width, BLOCK_HEIGHT, depth);
    const material = new THREE.MeshLambertMaterial({ color: color });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

function createFlashOutline(width, depth, y) {
    const shape = new THREE.Shape();
    shape.moveTo(-width / 2, -depth / 2);
    shape.lineTo(width / 2, -depth / 2);
    shape.lineTo(width / 2, depth / 2);
    shape.lineTo(-width / 2, depth / 2);
    shape.lineTo(-width / 2, -depth / 2);
    const geometry = new THREE.BufferGeometry().setFromPoints(shape.getPoints());
    const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2, transparent: true, opacity: 1 });
    const line = new THREE.Line(geometry, material);
    line.position.y = y + BLOCK_HEIGHT / 2 + 0.07;
    line.renderOrder = 2;
    return line;
}

function getBlockColor(idx, total) {
    const t = total <= 1 ? 0 : idx / (total - 1);
    const h = lerp(baseHue, topHue, t);
    const c = new THREE.Color();
    c.setHSL(h / 360, 0.13 + t * 0.13, 1 - t * 0.25);
    return c.getHex();
}

function updateScoreDisplay() {
    scoreDiv.innerText = score;
}

function showGameOver() {
    gameOverDiv.innerHTML = `Game Over!<br>Score: ${score}<br>High Score: ${highScore}<br><span style="font-size:24px;">Tap to Restart</span>`;
    gameOverDiv.style.display = '';
}

function hideGameOver() {
    gameOverDiv.style.display = 'none';
}

function resetGame() {
    while (blocks.length) {
        const b = blocks.pop();
        scene.remove(b.mesh);
        b.mesh.geometry.dispose();
        b.mesh.material.dispose();
    }
    while (cutPieces.length) {
        const c = cutPieces.pop();
        scene.remove(c.mesh);
        c.mesh.geometry.dispose();
        c.mesh.material.dispose();
    }
    if (activeBlock) {
        scene.remove(activeBlock.mesh);
        activeBlock.mesh.geometry.dispose();
        activeBlock.mesh.material.dispose();
        activeBlock = null;
    }
    if (flashMesh) {
        scene.remove(flashMesh);
        flashMesh.geometry.dispose();
        flashMesh.material.dispose();
        flashMesh = null;
    }
    score = 0;
    blockSpeed = INITIAL_SPEED;
    perfectStreak = 0;
    direction = 1;
    moveAxis = 'x';
    backgroundColor.setStyle(getGradientColor(0));
    renderer.setClearColor(backgroundColor);
    hideGameOver();
    setupTower();
    spawnNextBlock();
    updateScoreDisplay();
    gameState = GAME_STATE_PLAYING;
}

function setupTower() {
    const color = getBlockColor(0, 16);
    const mesh = createBlock(INITIAL_BLOCK_SIZE, INITIAL_BLOCK_SIZE, BLOCK_HEIGHT / 2, color);
    scene.add(mesh);
    blocks.push({
        mesh: mesh,
        width: INITIAL_BLOCK_SIZE,
        depth: INITIAL_BLOCK_SIZE,
        x: 0,
        z: 0,
        y: BLOCK_HEIGHT / 2
    });
    lastBlock = blocks[blocks.length - 1];
}

function spawnNextBlock() {
    const prev = blocks[blocks.length - 1];
    let width = prev.width;
    let depth = prev.depth;
    let x = prev.x, z = prev.z;
    let color = getBlockColor(blocks.length, 16);
    let y = prev.y + BLOCK_HEIGHT;
    if (moveAxis === 'x') {
        x = -18 * direction;
    } else {
        z = -18 * direction;
    }
    const mesh = createBlock(width, depth, y, color, x, z);
    scene.add(mesh);
    activeBlock = {
        mesh: mesh,
        width: width,
        depth: depth,
        x: x,
        z: z,
        y: y,
        direction: direction,
        moveAxis: moveAxis,
        speed: blockSpeed,
        state: 'sliding'
    };
}

function dropActiveBlock() {
    if (!activeBlock || activeBlock.state !== 'sliding') return;
    activeBlock.state = 'dropping';
    const prev = blocks[blocks.length - 1];
    let overlap, cutLeft = 0, cutRight = 0, cutFront = 0, cutBack = 0;
    let axis = activeBlock.moveAxis;
    let perfect = false;
    let offset = 0;
    if (axis === 'x') {
        offset = activeBlock.x - prev.x;
        overlap = activeBlock.width - Math.abs(offset);
        if (Math.abs(offset) < PERFECT_EPSILON) {
            perfect = true;
            overlap = activeBlock.width;
        }
        if (overlap <= 0) {
            missBlock();
            return;
        }
        cutLeft = offset > 0 ? offset : 0;
        cutRight = offset < 0 ? -offset : 0;
    } else {
        offset = activeBlock.z - prev.z;
        overlap = activeBlock.depth - Math.abs(offset);
        if (Math.abs(offset) < PERFECT_EPSILON) {
            perfect = true;
            overlap = activeBlock.depth;
        }
        if (overlap <= 0) {
            missBlock();
            return;
        }
        cutFront = offset > 0 ? offset : 0;
        cutBack = offset < 0 ? -offset : 0;
    }
    if (perfect) {
        perfectStreak++;
        flashTimer = 0.3;
        if (flashMesh) {
            scene.remove(flashMesh);
            flashMesh.geometry.dispose();
            flashMesh.material.dispose();
            flashMesh = null;
        }
        flashMesh = createFlashOutline(activeBlock.width, activeBlock.depth, activeBlock.y);
        scene.add(flashMesh);
        if (perfectStreak >= STREAK_FOR_COMEBACK) {
            if (axis === 'x') {
                activeBlock.width = Math.min(MAX_COMEBACK_SIZE, INITIAL_BLOCK_SIZE);
            } else {
                activeBlock.depth = Math.min(MAX_COMEBACK_SIZE, INITIAL_BLOCK_SIZE);
            }
            perfectStreak = 0;
        }
    } else {
        perfectStreak = 0;
        if (axis === 'x') {
            if (cutLeft > 0) createCutPiece('x', activeBlock, cutLeft, 1);
            if (cutRight > 0) createCutPiece('x', activeBlock, cutRight, -1);
            activeBlock.width = overlap;
            activeBlock.x = prev.x + offset / 2;
        } else {
            if (cutFront > 0) createCutPiece('z', activeBlock, cutFront, 1);
            if (cutBack > 0) createCutPiece('z', activeBlock, cutBack, -1);
            activeBlock.depth = overlap;
            activeBlock.z = prev.z + offset / 2;
        }
    }
    activeBlock.mesh.scale.set(
        activeBlock.width / activeBlock.mesh.geometry.parameters.width,
        1,
        activeBlock.depth / activeBlock.mesh.geometry.parameters.depth
    );
    activeBlock.mesh.position.set(activeBlock.x, activeBlock.y, activeBlock.z);
    blocks.push({
        mesh: activeBlock.mesh,
        width: activeBlock.width,
        depth: activeBlock.depth,
        x: activeBlock.x,
        z: activeBlock.z,
        y: activeBlock.y
    });
    lastBlock = activeBlock;
    activeBlock = null;
    score++;
    updateScoreDisplay();
    if (score % SPEED_INCREASE_EVERY === 0) blockSpeed += SPEED_INCREMENT;
    direction *= -1;
    moveAxis = moveAxis === 'x' ? 'z' : 'x';
    setTimeout(spawnNextBlock, 130);
}

function missBlock() {
    activeBlock.state = 'falling';
    activeBlock.fallVelocity = -0.7;
    activeBlock.fallTimer = 0;
    if (score > highScore) {
        highScore = score;
    }
    gameState = GAME_STATE_GAMEOVER;
    showGameOver();
}

function createCutPiece(axis, block, cutSize, dir) {
    let width = block.width, depth = block.depth, x = block.x, z = block.z;
    if (axis === 'x') {
        width = cutSize;
        x += dir * (block.width / 2 + cutSize / 2) - dir * (cutSize / 2);
    } else {
        depth = cutSize;
        z += dir * (block.depth / 2 + cutSize / 2) - dir * (cutSize / 2);
    }
    const mesh = createBlock(width, depth, block.y, 0xdedede, x, z);
    scene.add(mesh);
    cutPieces.push({
        mesh: mesh,
        velocity: new THREE.Vector3(
            axis === 'x' ? 0.17 * dir : 0,
            -0.38,
            axis === 'z' ? 0.17 * dir : 0
        )
    });
}

function updateCutPieces(dt) {
    for (let i = cutPieces.length - 1; i >= 0; i--) {
        const c = cutPieces[i];
        c.mesh.position.addScaledVector(c.velocity, dt * 60);
        c.velocity.y -= 0.022 * dt * 60;
        if (c.mesh.position.y < -40) {
            scene.remove(c.mesh);
            c.mesh.geometry.dispose();
            c.mesh.material.dispose();
            cutPieces.splice(i, 1);
        }
    }
}

function updateFlash(dt) {
    if (flashMesh) {
        flashTimer -= dt;
        if (flashTimer <= 0) {
            scene.remove(flashMesh);
            flashMesh.geometry.dispose();
            flashMesh.material.dispose();
            flashMesh = null;
        } else {
            flashMesh.material.opacity = Math.max(0, flashTimer / 0.3);
        }
    }
}

function animate(time) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.035, renderer.info.render.frame ? (time - renderer.info.render.frame) / 1000 : 0.016);
    renderer.info.render.frame = time;
    if (activeBlock && activeBlock.state === 'sliding') {
        let bound = 18;
        if (activeBlock.moveAxis === 'x') {
            activeBlock.x += activeBlock.speed * activeBlock.direction;
            if (activeBlock.x > bound) {
                activeBlock.x = bound;
                activeBlock.direction *= -1;
            }
            if (activeBlock.x < -bound) {
                activeBlock.x = -bound;
                activeBlock.direction *= -1;
            }
            activeBlock.mesh.position.x = activeBlock.x;
        } else {
            activeBlock.z += activeBlock.speed * activeBlock.direction;
            if (activeBlock.z > bound) {
                activeBlock.z = bound;
                activeBlock.direction *= -1;
            }
            if (activeBlock.z < -bound) {
                activeBlock.z = -bound;
                activeBlock.direction *= -1;
            }
            activeBlock.mesh.position.z = activeBlock.z;
        }
    }
    if (activeBlock && activeBlock.state === 'falling') {
        activeBlock.mesh.position.y += activeBlock.fallVelocity;
        activeBlock.fallVelocity -= 0.04;
        if (activeBlock.mesh.position.y < -40) {
            activeBlock.mesh.position.y = -40;
        }
    }
    updateCutPieces(dt);
    updateFlash(dt);
    if (blocks.length > 0) {
        const topY = blocks[blocks.length - 1].y;
        camera.position.y = lerp(camera.position.y, topY + CAMERA_OFFSET_Y, 0.08);
        camera.position.z = lerp(camera.position.z, CAMERA_OFFSET_Z + Math.max(0, (blocks.length - 12) * 0.5), 0.08);
    }
    if (score > 0) {
        let t = Math.min(1, score / 30);
        const col = getGradientColor(t);
        renderer.setClearColor(col);
    }
    renderer.render(scene, camera);
}

function onUserInput() {
    if (gameState === GAME_STATE_PLAYING) {
        dropActiveBlock();
    } else if (gameState === GAME_STATE_GAMEOVER) {
        resetGame();
    }
}

function setupThree() {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    renderer.setClearColor(getGradientColor(0));

    camera = new THREE.OrthographicCamera(
        window.innerWidth / -32,
        window.innerWidth / 32,
        window.innerHeight / 32,
        window.innerHeight / -32,
        0.1,
        1000
    );
    camera.position.set(18, CAMERA_OFFSET_Y, CAMERA_OFFSET_Z);
    camera.lookAt(0, 0, 0);

    ambientLight = new THREE.AmbientLight(0xffffff, 0.66);
    scene.add(ambientLight);

    dirLight = new THREE.DirectionalLight(0xffffff, 0.72);
    dirLight.position.set(8, 40, 16);
    scene.add(dirLight);

    const bgPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshBasicMaterial({ color: 0x89d6c2, depthWrite: false })
    );
    bgPlane.position.y = -32;
    bgPlane.position.z = -60;
    scene.add(bgPlane);

    window.addEventListener('resize', onWindowResize);
    renderer.domElement.addEventListener('pointerdown', onUserInput);
    renderer.domElement.addEventListener('touchstart', onUserInput);
}

function onWindowResize() {
    camera.left = window.innerWidth / -32;
    camera.right = window.innerWidth / 32;
    camera.top = window.innerHeight / 32;
    camera.bottom = window.innerHeight / -32;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

setupThree();
resetGame();
animate(performance.now());
    </script>
</body>
