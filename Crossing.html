<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Courier Crossing</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11161d;
      --panel: rgba(14, 19, 24, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: rgba(244, 247, 251, 0.72);
      --accent: #ffca28;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      min-width: 96px;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .panel span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #scoreBox {
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: calc(env(safe-area-inset-left, 0px) + 14px);
    }

    #walletBox {
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: calc(env(safe-area-inset-right, 0px) + 14px);
      text-align: right;
    }

    #phaseBox {
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(5, 8, 12, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(420px, 100%);
      padding: 20px 18px 18px;
      border-radius: 22px;
      background: rgba(12, 16, 21, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.34);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 28px;
      line-height: 1;
    }

    #overlayText {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    #menuCoins {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 202, 40, 0.1);
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    #playBtn {
      margin-top: 16px;
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffd147, #ffb703);
      color: #271800;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    #skinGrid {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .skinBtn {
      width: 100%;
      padding: 12px 13px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      text-align: left;
    }

    .skinHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skinName {
      font-size: 15px;
      font-weight: 900;
    }

    .skinMeta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="panel" id="scoreBox"><span>Score</span><div id="scoreValue">0</div></div>
    <div class="panel" id="phaseBox"><span>Time</span><div id="phaseValue">Day</div></div>
    <div class="panel" id="walletBox"><span>Coins</span><div id="walletValue">0</div></div>
  </div>

  <div id="overlay">
    <div class="card">
      <div class="eyebrow">Courier Run</div>
      <h1 id="overlayTitle">Cross Kigali</h1>
      <p id="overlayText">Tap anywhere to hop forward. Swipe left, right, or down to move.</p>
      <button id="playBtn" type="button">Start Run</button>
      <div id="menuCoins">Coins 0</div>
      <div id="skinGrid"></div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: true
      });

      const scoreValueEl = document.getElementById("scoreValue");
      const phaseValueEl = document.getElementById("phaseValue");
      const walletValueEl = document.getElementById("walletValue");
      const overlayEl = document.getElementById("overlay");
      const overlayTitleEl = document.getElementById("overlayTitle");
      const overlayTextEl = document.getElementById("overlayText");
      const playBtn = document.getElementById("playBtn");
      const menuCoinsEl = document.getElementById("menuCoins");
      const skinGridEl = document.getElementById("skinGrid");

      const SAVE_KEY = "crossing_east_africa_v1";
      const COLS = 9;
      const HOP_MS = 105;
      const PLAYER_SIZE = 0.72;
      const AUTO_SCROLL = 0.3;
      const SAFE_START_ROWS = 3;
      const SKINS = [
        { id: "default", name: "Green Pack", cost: 0, body: "#fff7dc", bag: "#0ea56d", accent: "#114b32", note: "Classic courier." },
        { id: "sun", name: "Sun Rider", cost: 16, body: "#fff0b8", bag: "#ff8f00", accent: "#8c4a00", note: "Orange street runner." },
        { id: "blue", name: "Blue Drop", cost: 28, body: "#f2fbff", bag: "#2196f3", accent: "#0c4870", note: "Delivery league style." },
        { id: "moto", name: "Moto Rush", cost: 42, body: "#f5f5f5", bag: "#e53935", accent: "#5b1513", note: "Fast red courier kit." },
        { id: "night", name: "Night Flash", cost: 60, body: "#dff8ff", bag: "#7c4dff", accent: "#261554", note: "Late-night reflective pack." }
      ];

      const lanes = [];
      let topGeneratedRow = -1;
      let guaranteedSafeCol = Math.floor(COLS / 2);
      let viewportWidth = 0;
      let viewportHeight = 0;
      let dpr = 1;
      let tileSize = 40;
      let worldLeft = 0;
      let visibleRows = 16;
      let lastFrame = 0;

      const game = {
        running: false,
        dead: false,
        score: 0,
        bestRow: 0,
        deathReason: "",
        cameraRow: -5.2
      };

      const player = {
        x: Math.floor(COLS / 2),
        y: 0,
        fromX: Math.floor(COLS / 2),
        fromY: 0,
        toX: Math.floor(COLS / 2),
        toY: 0,
        moving: false,
        hopStart: 0,
        hopEnd: 0
      };

      let progress = loadProgress();

      function clamp(value, min, max) {
        return value < min ? min : value > max ? max : value;
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function randInt(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function defaultProgress() {
        return {
          coins: 0,
          selected: "default",
          unlocked: { default: true }
        };
      }

      function normalizeProgress(raw) {
        const base = defaultProgress();
        if (!raw || typeof raw !== "object") {
          return base;
        }
        base.coins = Math.max(0, Number(raw.coins) || 0);
        if (raw.selected && SKINS.some((skin) => skin.id === raw.selected)) {
          base.selected = raw.selected;
        }
        if (raw.unlocked && typeof raw.unlocked === "object") {
          for (let i = 0; i < SKINS.length; i += 1) {
            const skin = SKINS[i];
            if (raw.unlocked[skin.id]) {
              base.unlocked[skin.id] = true;
            }
          }
        }
        if (!base.unlocked[base.selected]) {
          base.selected = "default";
        }
        return base;
      }

      function loadProgress() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          return normalizeProgress(raw ? JSON.parse(raw) : null);
        } catch (error) {
          return defaultProgress();
        }
      }

      function saveProgress() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(progress));
        } catch (error) {
          // Ignore storage failures and keep session-only progress.
        }
      }

      function getSelectedSkin() {
        for (let i = 0; i < SKINS.length; i += 1) {
          if (SKINS[i].id === progress.selected) {
            return SKINS[i];
          }
        }
        return SKINS[0];
      }

      function isObstacleAt(lane, col) {
        if (!lane || lane.type !== "safe") {
          return false;
        }
        for (let i = 0; i < lane.obstacles.length; i += 1) {
          if (lane.obstacles[i].col === col) {
            return true;
          }
        }
        return false;
      }

      function getLane(row) {
        if (!lanes.length) {
          return null;
        }
        const index = row - lanes[0].row;
        return index >= 0 && index < lanes.length ? lanes[index] : null;
      }

      function getNightLevel() {
        return clamp(game.score / 150, 0, 1);
      }

      function getPhaseLabel(level) {
        if (level < 0.2) {
          return "Day";
        }
        if (level < 0.5) {
          return "Dusk";
        }
        if (level < 0.82) {
          return "Night";
        }
        return "Late";
      }

      function updateHud() {
        scoreValueEl.textContent = String(game.score);
        walletValueEl.textContent = String(progress.coins);
        phaseValueEl.textContent = getPhaseLabel(getNightLevel());
        menuCoinsEl.textContent = "Coins " + progress.coins;
      }

      function buildSkinGrid() {
        let html = "";
        for (let i = 0; i < SKINS.length; i += 1) {
          const skin = SKINS[i];
          const unlocked = !!progress.unlocked[skin.id];
          let tag = unlocked ? (progress.selected === skin.id ? "Selected" : "Owned") : skin.cost + " coins";
          html +=
            '<button class="skinBtn" type="button" data-skin="' + skin.id + '" style="border-color:' + skin.bag + '33;">' +
            '<div class="skinHead">' +
            '<div class="skinName" style="color:' + skin.bag + ';">' + skin.name + "</div>" +
            '<div class="tag">' + tag + "</div>" +
            "</div>" +
            '<div class="skinMeta">' + skin.note + "</div>" +
            "</button>";
        }
        skinGridEl.innerHTML = html;
      }

      function showOverlay(title, text, buttonLabel) {
        overlayTitleEl.textContent = title;
        overlayTextEl.textContent = text;
        playBtn.textContent = buttonLabel;
        overlayEl.classList.add("show");
        buildSkinGrid();
        updateHud();
      }

      function hideOverlay() {
        overlayEl.classList.remove("show");
      }

      function resize() {
        viewportWidth = window.innerWidth;
        viewportHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        tileSize = Math.max(34, Math.min(48, Math.floor(Math.min(viewportWidth / COLS, viewportHeight / 11.5))));
        worldLeft = Math.floor((viewportWidth - COLS * tileSize) * 0.5);
        visibleRows = Math.ceil(viewportHeight / tileSize) + 3;
        canvas.width = Math.max(1, Math.round(viewportWidth * dpr));
        canvas.height = Math.max(1, Math.round(viewportHeight * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function laneTop(row) {
        return viewportHeight - ((row - game.cameraRow) + 1) * tileSize;
      }

      function laneCenter(rowFloat) {
        return viewportHeight - ((rowFloat - game.cameraRow) + 0.5) * tileSize;
      }

      function cellCenterX(colFloat) {
        return worldLeft + (colFloat + 0.5) * tileSize;
      }

      function createSafeLane(row) {
        const obstacles = [];
        const taken = {};
        const targetCol = row < SAFE_START_ROWS
          ? Math.floor(COLS / 2)
          : clamp(guaranteedSafeCol + randInt(-1, 1), 1, COLS - 2);
        guaranteedSafeCol = targetCol;
        for (let col = targetCol - 1; col <= targetCol + 1; col += 1) {
          if (col >= 0 && col < COLS) {
            taken[col] = true;
          }
        }

        const obstacleCount = row < SAFE_START_ROWS ? randInt(0, 1) : randInt(1, 3);
        for (let i = 0; i < obstacleCount; i += 1) {
          const col = randInt(0, COLS - 1);
          if (taken[col] || (row < SAFE_START_ROWS + 1 && Math.abs(col - Math.floor(COLS / 2)) < 2)) {
            continue;
          }
          taken[col] = true;
          obstacles.push({
            col,
            kind: Math.random() < 0.65 ? "tree" : "rock"
          });
        }

        let coinCol = null;
        if (Math.random() < 0.45) {
          for (let tries = 0; tries < 10; tries += 1) {
            const col = randInt(0, COLS - 1);
            if (!taken[col]) {
              coinCol = col;
              break;
            }
          }
        }

        return {
          row,
          type: "safe",
          obstacles,
          pathCol: targetCol,
          coinCol,
          coinTaken: false
        };
      }

      function createTrafficLane(row) {
        const bodaLane = Math.random() < 0.58;
        const dir = Math.random() < 0.5 ? -1 : 1;
        const speed = bodaLane ? rand(1.45, 2.35) : rand(0.8, 1.3);
        const count = bodaLane ? randInt(4, 5) : randInt(2, 3);
        const movers = [];
        let cursor = dir > 0 ? -rand(0, 2.6) : COLS + rand(0, 2.6);

        for (let i = 0; i < count; i += 1) {
          const len = bodaLane ? rand(0.82, 1.02) : rand(1.7, 2.35);
          movers.push({
            x: cursor,
            len,
            kind: bodaLane ? "boda" : "matatu"
          });
          cursor += dir > 0 ? len + rand(1.7, 2.5) : -(len + rand(1.7, 2.5));
        }

        return {
          row,
          type: "road",
          dir,
          speed,
          movers
        };
      }

      function createMarketLane(row) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        const speed = rand(0.7, 1.15);
        const movers = [];
        const count = randInt(3, 4);
        let cursor = dir > 0 ? -rand(0, 2.2) : COLS + rand(0, 2.2);

        for (let i = 0; i < count; i += 1) {
          const cart = Math.random() < 0.5;
          const len = cart ? rand(1.2, 1.7) : rand(1.85, 2.45);
          movers.push({
            x: cursor,
            len,
            kind: cart ? "cart" : "stall"
          });
          cursor += dir > 0 ? len + rand(1.4, 2.1) : -(len + rand(1.4, 2.1));
        }

        return {
          row,
          type: "market",
          dir,
          speed,
          movers
        };
      }

      function generateLane(row) {
        if (row < SAFE_START_ROWS) {
          return createSafeLane(row);
        }

        const prevA = lanes.length ? lanes[lanes.length - 1].type : "safe";
        const prevB = lanes.length > 1 ? lanes[lanes.length - 2].type : "safe";
        if (prevA !== "safe" && prevB !== "safe" && Math.random() < 0.72) {
          return createSafeLane(row);
        }

        const roll = Math.random();
        if (roll < 0.25) {
          return createSafeLane(row);
        }
        if (roll < 0.68) {
          return createTrafficLane(row);
        }
        return createMarketLane(row);
      }

      function ensureLanes() {
        const minRow = Math.floor(game.cameraRow) - 4;
        const maxRow = Math.floor(game.cameraRow) + visibleRows + 8;

        if (!lanes.length) {
          topGeneratedRow = minRow - 1;
        }

        while (lanes.length && lanes[0].row < minRow) {
          lanes.shift();
        }

        while (topGeneratedRow < maxRow) {
          topGeneratedRow += 1;
          lanes.push(generateLane(topGeneratedRow));
        }
      }

      function wrapMover(lane, mover) {
        if (lane.dir > 0 && mover.x - mover.len * 0.5 > COLS + 1.6) {
          let minEdge = Infinity;
          for (let i = 0; i < lane.movers.length; i += 1) {
            if (lane.movers[i] === mover) {
              continue;
            }
            minEdge = Math.min(minEdge, lane.movers[i].x - lane.movers[i].len * 0.5);
          }
          mover.x = (minEdge === Infinity ? -1.6 : minEdge) - rand(1.3, 2.5) - mover.len * 0.5;
        } else if (lane.dir < 0 && mover.x + mover.len * 0.5 < -1.6) {
          let maxEdge = -Infinity;
          for (let i = 0; i < lane.movers.length; i += 1) {
            if (lane.movers[i] === mover) {
              continue;
            }
            maxEdge = Math.max(maxEdge, lane.movers[i].x + lane.movers[i].len * 0.5);
          }
          mover.x = (maxEdge === -Infinity ? COLS + 1.6 : maxEdge) + rand(1.3, 2.5) + mover.len * 0.5;
        }
      }

      function updateLanes(dt) {
        for (let i = 0; i < lanes.length; i += 1) {
          const lane = lanes[i];
          if (lane.type === "road" || lane.type === "market") {
            for (let j = 0; j < lane.movers.length; j += 1) {
              lane.movers[j].x += lane.speed * lane.dir * dt;
              wrapMover(lane, lane.movers[j]);
            }
          }
        }
      }

      function collectCoin(lane) {
        if (!lane || lane.coinTaken || lane.coinCol === null) {
          return;
        }
        lane.coinTaken = true;
        progress.coins += 1;
        saveProgress();
        updateHud();
      }

      function maybeCollectCoin() {
        const lane = getLane(Math.round(player.y));
        if (!lane || lane.type !== "safe" || lane.coinTaken || lane.coinCol === null) {
          return;
        }
        if (Math.abs(player.x - lane.coinCol) < 0.38) {
          collectCoin(lane);
        }
      }

      function snapPlayerToGrid() {
        player.x = clamp(Math.round(player.x), 0, COLS - 1);
      }

      function currentRoundedX() {
        return clamp(Math.round(player.x), 0, COLS - 1);
      }

      function beginHop(dx, dy) {
        if (!game.running || game.dead || player.moving) {
          return;
        }

        const currentLane = getLane(Math.round(player.y));
        if (currentLane && currentLane.type === "market") {
          snapPlayerToGrid();
        }

        const baseX = currentRoundedX();
        const baseY = Math.round(player.y);
        const targetX = baseX + dx;
        const targetY = baseY + dy;
        if (targetX < 0 || targetX >= COLS) {
          return;
        }

        const targetLane = getLane(targetY);
        if (!targetLane) {
          return;
        }
        if (targetLane.type === "safe" && isObstacleAt(targetLane, targetX)) {
          return;
        }

        const now = performance.now();
        player.moving = true;
        player.fromX = player.x;
        player.fromY = player.y;
        player.toX = targetX;
        player.toY = targetY;
        player.hopStart = now;
        player.hopEnd = now + HOP_MS;
      }

      function handleTapZone(x, y) {
        if (y >= viewportHeight * 0.8) {
          beginHop(0, -1);
          return;
        }
        if (x <= viewportWidth * 0.25) {
          beginHop(-1, 0);
          return;
        }
        if (x >= viewportWidth * 0.75) {
          beginHop(1, 0);
          return;
        }
        beginHop(0, 1);
      }

      function updatePlayerMovement(now) {
        if (!player.moving) {
          return;
        }
        const raw = (now - player.hopStart) / (player.hopEnd - player.hopStart);
        if (raw >= 1) {
          player.moving = false;
          player.x = player.toX;
          player.y = player.toY;
          const landedLane = getLane(Math.round(player.y));
          if (landedLane && landedLane.type !== "market") {
            snapPlayerToGrid();
          }
          const landedRow = Math.round(player.y);
          if (landedRow > game.bestRow) {
            game.bestRow = landedRow;
            game.score = landedRow;
          }
          maybeCollectCoin();
          return;
        }
        const t = easeOutCubic(clamp(raw, 0, 1));
        player.x = lerp(player.fromX, player.toX, t);
        player.y = lerp(player.fromY, player.toY, t);
      }

      function moverOverlap(mover, half, padding) {
        const minA = player.x - half - padding;
        const maxA = player.x + half + padding;
        const minB = mover.x - mover.len * 0.5;
        const maxB = mover.x + mover.len * 0.5;
        return maxA > minB && minA < maxB;
      }

      function findSupportMover(lane, half, forgiving) {
        const padding = forgiving ? 0.42 : 0;
        for (let i = 0; i < lane.movers.length; i += 1) {
          if (moverOverlap(lane.movers[i], half, padding)) {
            return lane.movers[i];
          }
        }
        return null;
      }

      function killPlayer(reason) {
        if (game.dead) {
          return;
        }
        game.running = false;
        game.dead = true;
        game.deathReason = reason;
        showOverlay("Run Over", reason, "Restart");
      }

      function updateCollisions(dt) {
        if (!game.running || game.dead) {
          return;
        }

        const half = PLAYER_SIZE * 0.5;
        let marketSupport = false;
        const isMidHop = player.moving;

        for (let i = 0; i < lanes.length; i += 1) {
          const lane = lanes[i];
          const rowDistance = Math.abs(player.y - lane.row);
          if (rowDistance > 0.42) {
            continue;
          }

          if (lane.type === "road") {
            if (isMidHop) {
              continue;
            }
            for (let j = 0; j < lane.movers.length; j += 1) {
              if (moverOverlap(lane.movers[j], half, 0.02)) {
                killPlayer("You got hit by traffic.");
                return;
              }
            }
          } else if (lane.type === "market") {
            const support = findSupportMover(lane, half, true);
            if (!support) {
              if (isMidHop) {
                continue;
              }
              killPlayer("You slipped into the market crowd.");
              return;
            }
            marketSupport = true;
            if (!isMidHop) {
              const snapped = clamp(player.x, support.x - support.len * 0.28, support.x + support.len * 0.28);
              player.x = Math.abs(player.x - support.x) < 0.55 ? snapped : support.x;
            }
            player.x += lane.speed * lane.dir * dt;
          }
        }

        if (!isMidHop && (player.x < -0.35 || player.x > COLS - 0.65)) {
          killPlayer("You were carried off the side.");
          return;
        }

        if (!marketSupport && !player.moving) {
          maybeCollectCoin();
        }

        if (player.y < game.cameraRow + 0.18) {
          killPlayer("The street swallowed you from below.");
        }
      }

      function resetGame() {
        lanes.length = 0;
        topGeneratedRow = -1;
        guaranteedSafeCol = Math.floor(COLS / 2);
        game.running = true;
        game.dead = false;
        game.score = 0;
        game.bestRow = 0;
        game.deathReason = "";
        game.cameraRow = -5.2;
        player.x = Math.floor(COLS / 2);
        player.y = 0;
        player.fromX = player.x;
        player.fromY = 0;
        player.toX = player.x;
        player.toY = 0;
        player.moving = false;
        ensureLanes();
        maybeCollectCoin();
        updateHud();
        hideOverlay();
      }

      function drawSafeLane(lane, y) {
        ctx.fillStyle = lane.row % 2 === 0 ? "#4f8f3e" : "#5ea245";
        ctx.fillRect(worldLeft, y, COLS * tileSize, tileSize);
        ctx.fillStyle = "rgba(233, 245, 196, 0.08)";
        for (let i = 0; i < COLS; i += 1) {
          ctx.fillRect(worldLeft + i * tileSize + 4, y + 4, tileSize - 8, 6);
        }

        for (let i = 0; i < lane.obstacles.length; i += 1) {
          const obstacle = lane.obstacles[i];
          const x = worldLeft + obstacle.col * tileSize;
          if (obstacle.kind === "tree") {
            ctx.fillStyle = "#805d2b";
            ctx.fillRect(x + tileSize * 0.43, y + tileSize * 0.48, tileSize * 0.14, tileSize * 0.28);
            ctx.fillStyle = "#2a6d2f";
            ctx.beginPath();
            ctx.arc(x + tileSize * 0.5, y + tileSize * 0.38, tileSize * 0.24, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = "#95a0a6";
            ctx.beginPath();
            ctx.arc(x + tileSize * 0.5, y + tileSize * 0.52, tileSize * 0.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (lane.coinCol !== null && !lane.coinTaken) {
          const cx = worldLeft + (lane.coinCol + 0.5) * tileSize;
          const cy = y + tileSize * 0.5;
          ctx.fillStyle = "#ffcf33";
          ctx.beginPath();
          ctx.arc(cx, cy, tileSize * 0.14, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff2b5";
          ctx.lineWidth = Math.max(1.5, tileSize * 0.05);
          ctx.beginPath();
          ctx.arc(cx, cy, tileSize * 0.1, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawHeadlight(mover, lane, y, nightLevel) {
        if (nightLevel < 0.25) {
          return;
        }
        const x = cellCenterX(mover.x);
        const cy = y + tileSize * 0.5;
        const width = mover.kind === "boda" ? tileSize * 0.34 : tileSize * 0.52;
        const reach = tileSize * (1.2 + nightLevel * 1.2);
        ctx.globalAlpha = 0.16 + nightLevel * 0.18;
        ctx.fillStyle = "#ffe49d";
        ctx.beginPath();
        if (lane.dir > 0) {
          ctx.moveTo(x + width * 0.4, cy - width * 0.34);
          ctx.lineTo(x + reach, cy - width * 0.88);
          ctx.lineTo(x + reach, cy + width * 0.88);
          ctx.lineTo(x + width * 0.4, cy + width * 0.34);
        } else {
          ctx.moveTo(x - width * 0.4, cy - width * 0.34);
          ctx.lineTo(x - reach, cy - width * 0.88);
          ctx.lineTo(x - reach, cy + width * 0.88);
          ctx.lineTo(x - width * 0.4, cy + width * 0.34);
        }
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawRoadLane(lane, y, nightLevel) {
        ctx.fillStyle = lane.row % 2 === 0 ? "#49423d" : "#544c47";
        ctx.fillRect(worldLeft, y, COLS * tileSize, tileSize);
        ctx.fillStyle = "#f4d35e";
        for (let i = 0; i < COLS; i += 1) {
          ctx.fillRect(worldLeft + i * tileSize + tileSize * 0.28, y + tileSize * 0.46, tileSize * 0.44, tileSize * 0.08);
        }

        for (let i = 0; i < lane.movers.length; i += 1) {
          const mover = lane.movers[i];
          drawHeadlight(mover, lane, y, nightLevel);
          const x = cellCenterX(mover.x);
          if (mover.kind === "boda") {
            ctx.fillStyle = "#ffd633";
            ctx.fillRect(x - tileSize * 0.24, y + tileSize * 0.3, tileSize * 0.48, tileSize * 0.22);
            ctx.fillStyle = "#1b7d3d";
            ctx.fillRect(x - tileSize * 0.12, y + tileSize * 0.22, tileSize * 0.24, tileSize * 0.2);
            ctx.fillStyle = "#20262d";
            ctx.fillRect(x - tileSize * 0.26, y + tileSize * 0.5, tileSize * 0.52, tileSize * 0.08);
          } else {
            const width = mover.len * tileSize;
            ctx.fillStyle = "#23a657";
            ctx.fillRect(x - width * 0.5, y + tileSize * 0.22, width, tileSize * 0.42);
            ctx.fillStyle = "#f6c744";
            ctx.fillRect(x - width * 0.5, y + tileSize * 0.42, width, tileSize * 0.08);
            ctx.fillStyle = "#f25f5c";
            ctx.fillRect(x - width * 0.16, y + tileSize * 0.28, width * 0.32, tileSize * 0.12);
          }
        }
      }

      function drawMarketLane(lane, y) {
        ctx.fillStyle = lane.row % 2 === 0 ? "#bf7c3d" : "#c98544";
        ctx.fillRect(worldLeft, y, COLS * tileSize, tileSize);
        ctx.fillStyle = "rgba(92, 47, 18, 0.12)";
        for (let i = 0; i < COLS; i += 1) {
          ctx.fillRect(worldLeft + i * tileSize + 5, y + 6, tileSize - 10, 6);
          ctx.fillRect(worldLeft + i * tileSize + 8, y + tileSize - 12, tileSize - 16, 5);
        }

        for (let i = 0; i < lane.movers.length; i += 1) {
          const mover = lane.movers[i];
          const x = cellCenterX(mover.x);
          const width = mover.len * tileSize;
          ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
          ctx.fillRect(x - width * 0.5 + 3, y + tileSize * 0.26 + 4, width, tileSize * 0.42);
          if (mover.kind === "stall") {
            ctx.fillStyle = "#6d4c41";
            ctx.fillRect(x - width * 0.5, y + tileSize * 0.3, width, tileSize * 0.18);
            ctx.fillStyle = "#ff7043";
            ctx.fillRect(x - width * 0.5, y + tileSize * 0.16, width, tileSize * 0.16);
            ctx.fillStyle = "#ffe082";
            ctx.fillRect(x - width * 0.32, y + tileSize * 0.38, width * 0.64, tileSize * 0.06);
          } else {
            ctx.fillStyle = "#795548";
            ctx.fillRect(x - width * 0.5, y + tileSize * 0.34, width, tileSize * 0.18);
            ctx.fillStyle = "#29b6f6";
            ctx.fillRect(x - width * 0.34, y + tileSize * 0.2, width * 0.68, tileSize * 0.14);
          }
        }
      }

      function drawPlayer(now) {
        const skin = getSelectedSkin();
        const px = cellCenterX(player.x);
        const py = laneCenter(player.y);
        let hopLift = 0;
        if (player.moving) {
          const t = clamp((now - player.hopStart) / (player.hopEnd - player.hopStart), 0, 1);
          hopLift = Math.sin(t * Math.PI) * tileSize * 0.18;
        }
        const size = tileSize * PLAYER_SIZE;
        const drawY = py - hopLift;
        ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
        ctx.fillRect(px - size * 0.45, drawY - size * 0.18, size * 0.9, size * 0.9);
        ctx.fillStyle = skin.body;
        ctx.fillRect(px - size * 0.36, drawY - size * 0.36, size * 0.72, size * 0.72);
        ctx.fillStyle = skin.bag;
        ctx.fillRect(px - size * 0.22, drawY - size * 0.22, size * 0.44, size * 0.26);
        ctx.fillStyle = skin.accent;
        ctx.fillRect(px - size * 0.28, drawY + size * 0.02, size * 0.56, size * 0.12);
      }

      function drawWorld(now) {
        const nightLevel = getNightLevel();
        ctx.fillStyle = nightLevel < 0.3 ? "#8ed6ff" : nightLevel < 0.7 ? "#34546f" : "#17263b";
        ctx.fillRect(0, 0, viewportWidth, viewportHeight);

        ctx.fillStyle = nightLevel < 0.5 ? "#90c66f" : "#32492b";
        ctx.fillRect(worldLeft - tileSize, 0, tileSize, viewportHeight);
        ctx.fillRect(worldLeft + COLS * tileSize, 0, tileSize, viewportHeight);

        const firstRow = Math.floor(game.cameraRow) - 1;
        const lastRow = Math.floor(game.cameraRow) + visibleRows + 1;
        for (let row = firstRow; row <= lastRow; row += 1) {
          const lane = getLane(row);
          if (!lane) {
            continue;
          }
          const y = laneTop(row);
          if (y > viewportHeight || y + tileSize < 0) {
            continue;
          }

          if (lane.type === "safe") {
            drawSafeLane(lane, y);
          } else if (lane.type === "road") {
            drawRoadLane(lane, y, nightLevel);
          } else {
            drawMarketLane(lane, y);
          }
        }

        drawPlayer(now);

        if (nightLevel > 0) {
          ctx.fillStyle = "rgba(9, 14, 24, " + (nightLevel * 0.54) + ")";
          ctx.fillRect(0, 0, viewportWidth, viewportHeight);
        }
      }

      function update(now) {
        if (!lastFrame) {
          lastFrame = now;
        }
        const dt = Math.min(0.033, (now - lastFrame) / 1000);
        lastFrame = now;

        if (game.running && !game.dead) {
          game.cameraRow += AUTO_SCROLL * dt;
          ensureLanes();
          updateLanes(dt);
          updatePlayerMovement(now);
          updateCollisions(dt);
          updateHud();
        }

        drawWorld(now);
        requestAnimationFrame(update);
      }

      function onPointerDown(event) {
        if (overlayEl.classList.contains("show")) {
          return;
        }
        event.preventDefault();
        handleTapZone(event.clientX, event.clientY);
      }

      playBtn.addEventListener("click", resetGame);
      skinGridEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-skin]");
        if (!button) {
          return;
        }
        const id = button.getAttribute("data-skin");
        const skin = SKINS.find((entry) => entry.id === id);
        if (!skin) {
          return;
        }
        if (progress.unlocked[id]) {
          progress.selected = id;
          saveProgress();
          buildSkinGrid();
          return;
        }
        if (progress.coins < skin.cost) {
          return;
        }
        progress.coins -= skin.cost;
        progress.unlocked[id] = true;
        progress.selected = id;
        saveProgress();
        buildSkinGrid();
        updateHud();
      });

      window.addEventListener("resize", resize);
      canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      window.addEventListener("touchmove", (event) => {
        event.preventDefault();
      }, { passive: false });

      resize();
      updateHud();
      buildSkinGrid();
      resetGame();
      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
