                        const angle = (Math.PI * 2 * index) / boss.burstCount;
                        spawnBullet(boss, angle, now, {
                            speed: boss.bulletSpeed,
                            radius: boss.bulletRadius,
                            range: boss.bulletRange,
                            damage: boss.damage,
                            color: boss.bodyColor,
                            isBoss: true
                        });
                    }
                }
            }
        }

        function updateBossEscorts(now, dt) {
            for (let i = bossEscorts.length - 1; i >= 0; i -= 1) {
                const escort = bossEscorts[i];
                if (escort.hp <= 0) {
                    bossEscorts.splice(i, 1);
                    continue;
                }

                if (now >= escort.thinkAt) {
                    escort.thinkAt = now + rand(180, 340);
                    const target = player.alive ? player : randomAliveBot();
                    if (target) {
                        escort.targetX = target.x;
                        escort.targetY = target.y;
                    } else if (boss) {
                        escort.targetX = boss.x;
                        escort.targetY = boss.y;
                    }
                }

                const dx = escort.targetX - escort.x;
                const dy = escort.targetY - escort.y;
                const distance = Math.hypot(dx, dy) || 1;
                const nx = dx / distance;
                const ny = dy / distance;
                const accel = 1 - Math.pow(0.0008, dt);
                const targetVX = nx * escort.moveSpeed;
                const targetVY = ny * escort.moveSpeed;

                escort.vx += (targetVX - escort.vx) * accel;
                escort.vy += (targetVY - escort.vy) * accel;
                escort.x += escort.vx * dt;
                escort.y += escort.vy * dt;
                escort.x = clamp(escort.x, escort.radius, CONFIG.worldSize - escort.radius);
                escort.y = clamp(escort.y, escort.radius, CONFIG.worldSize - escort.radius);
                escort.barrelAngle = Math.atan2(ny, nx);

                if (now >= escort.nextBurstAt) {
                    escort.nextBurstAt = now + rand(720, 1080);
                    if (escort.fireMode === "bomb") {
                        spawnBullet(escort, escort.barrelAngle, now, {
                            speed: escort.bulletSpeed * 0.72,
                            radius: escort.bulletRadius,
                            range: escort.bulletRange + 40,
                            damage: escort.damage * 0.55,
                            color: escort.bodyColor,
                            explosiveRadius: 70,
                            explosionDamage: escort.damage * 2.1,
                            explosionColor: "#ffbe79",
                            isBoss: true
                        });
                    } else {
                        for (let index = -1; index <= 1; index += 1) {
                            spawnBullet(escort, escort.barrelAngle + (index * 0.14), now, {
                                speed: escort.bulletSpeed,
                                radius: escort.bulletRadius,
                                range: escort.bulletRange,
                                damage: escort.damage,
                                color: escort.bodyColor,
                                isBoss: true
                            });
                        }
                    }
                }
            }
        }

        function updateBossShields(dt) {
            if (!boss) {
                bossShields.length = 0;
                return;
            }

            for (let i = bossShields.length - 1; i >= 0; i -= 1) {
                const shield = bossShields[i];
                if (shield.hp <= 0) {
                    bossShields.splice(i, 1);
                    continue;
                }

                shield.angle += dt * 1.4;
                shield.rotation += shield.spin * dt;
                shield.x = boss.x + (Math.cos(shield.angle) * shield.distance);
                shield.y = boss.y + (Math.sin(shield.angle) * shield.distance);
            }
        }

        function spawnShapeSwarm(now) {
            if (!player.alive) {
                return;
            }

            const count = Math.floor(rand(CONFIG.shapeSwarmMin, CONFIG.shapeSwarmMax + 1));
            const used = Object.create(null);
            shapeSwarm.active = true;
            shapeSwarm.x = player.x;
            shapeSwarm.y = player.y;
            shapeSwarm.expiresAt = now + CONFIG.shapeSwarmDuration;
            shapeSwarm.nextSpawnAt = now + CONFIG.shapeSwarmInterval;

            let spawned = 0;
            while (spawned < count) {
                const index = Math.floor(rand(0, shapes.length));
                if (used[index]) {
                    continue;
                }

                used[index] = true;
                const shape = shapes[index];
                const type = Math.random() < 0.72 ? "triangle" : "pentagon";
                const angle = rand(0, Math.PI * 2);
                const distance = rand(80, CONFIG.shapeSwarmRadius);
                applyShapeType(shape, type);
                shape.x = clamp(player.x + (Math.cos(angle) * distance), 60, CONFIG.worldSize - 60);
                shape.y = clamp(player.y + (Math.sin(angle) * distance), 60, CONFIG.worldSize - 60);
                shape.rotation = rand(0, Math.PI * 2);
                shape.spin = rand(-1.2, 1.2);
                shape.alive = true;
                spawned += 1;
            }

            setEventNotice("Shape Swarm: jackpot just dropped around you.", now, 2600);
        }

        function updateShapeSwarm(now) {
            if (!shapeSwarm.active) {
                if (player.alive && now >= shapeSwarm.nextSpawnAt) {
                    spawnShapeSwarm(now);
                }
                return;
            }

            if (now >= shapeSwarm.expiresAt) {
                shapeSwarm.active = false;
            }
        }

        function updateHotZone(now, dt) {
            if (!hotZone.active) {
                if (now >= hotZone.nextSpawnAt) {
                    spawnHotZone(now);
                }
                return;
            }

            if (now >= hotZone.expiresAt) {
                hotZone.active = false;
                return;
            }

            const tanks = [player].concat(bots);
            for (let i = 0; i < tanks.length; i += 1) {
                const tank = tanks[i];
                if (!tankInsideHotZone(tank)) {
                    continue;
                }

                gainXp(tank, CONFIG.hotZoneXpPerSecond * 3 * dt);
                tank.hp -= CONFIG.hotZoneDamagePerSecond * dt;
                tank.lastHitAt = now;

                if (tank.hp <= 0) {
                    killTank(tank, null, now);
                }
            }
        }

        function updateBoosts(now, dt) {
            if (now >= nextBoostAt) {
                boosts.push(makeBoost(now));
                nextBoostAt = now + CONFIG.boostSpawnInterval;
            }

            for (let i = boosts.length - 1; i >= 0; i -= 1) {
                const boost = boosts[i];
                boost.rotation += boost.spin * dt;

                if (now >= boost.expiresAt) {
                    boosts.splice(i, 1);
                    continue;
                }

                const tanks = [player].concat(bots);
                let picked = false;
                for (let t = 0; t < tanks.length; t += 1) {
                    const tank = tanks[t];
                    if (!tank.alive) {
                        continue;
                    }

                    const hitDist = boost.r + tank.radius;
                    if (distSq(boost.x, boost.y, tank.x, tank.y) <= hitDist * hitDist) {
                        applyBoostPickup(tank, boost, now);
                        boosts.splice(i, 1);
                        picked = true;
                        break;
                    }
                }

                if (picked) {
                    continue;
                }
            }
        }

        function updateMutators(now) {
            const tanks = [player].concat(bots);
            for (let i = 0; i < tanks.length; i += 1) {
                if (tanks[i].mutatorType && now >= tanks[i].mutatorUntil) {
                    clearMutator(tanks[i]);
                }
                if (tanks[i].pickupBoostType && now >= tanks[i].pickupBoostUntil) {
                    clearPickupBoost(tanks[i]);
                }
            }
        }

        function updateAutoHeal(now, dt) {
            const tanks = [player].concat(bots);

            for (let index = 0; index < tanks.length; index += 1) {
                const tank = tanks[index];
                if (!tank.alive || tank.hp >= tank.maxHp) {
                    continue;
                }

                if (now - tank.lastHitAt >= CONFIG.autoHealDelay) {
                    tank.hp = Math.min(tank.maxHp, tank.hp + (tank.regenRate * dt));
                }
            }
        }

        function resolveTankSeparation() {
            const tanks = [player].concat(bots);

            for (let i = 0; i < tanks.length; i += 1) {
                const a = tanks[i];
                if (!a.alive) {
                    continue;
                }

                for (let j = i + 1; j < tanks.length; j += 1) {
                    const b = tanks[j];
                    if (!b.alive) {
                        continue;
                    }

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy) || 0.0001;
                    const minDist = a.radius + b.radius + 4;
                    if (distance < minDist) {
                        const push = (minDist - distance) * 0.5;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        a.x -= nx * push;
                        a.y -= ny * push;
                        b.x += nx * push;
                        b.y += ny * push;
                    }
                }

                if (boss) {
                    const dx = boss.x - a.x;
                    const dy = boss.y - a.y;
                    const distance = Math.hypot(dx, dy) || 0.0001;
                    const minDist = a.radius + boss.radius + 6;
                    if (distance < minDist) {
                        const push = minDist - distance;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        a.x -= nx * push;
                        a.y -= ny * push;
                    }
                }

                for (let shieldIndex = 0; shieldIndex < bossEscorts.length; shieldIndex += 1) {
                    const escort = bossEscorts[shieldIndex];
                    const dx = escort.x - a.x;
                    const dy = escort.y - a.y;
                    const distance = Math.hypot(dx, dy) || 0.0001;
                    const minDist = a.radius + escort.radius + 6;
                    if (distance < minDist) {
                        const push = minDist - distance;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        a.x -= nx * push;
                        a.y -= ny * push;
                    }
                }
            }
        }

        function damageShapeTarget(shape, damage, attacker, now) {
            shape.hp -= damage;

            if (attacker) {
                healFromHit(attacker, now);
            }

            if (shape.hp <= 0) {
                shape.alive = false;
                if (attacker) {
                    gainXp(attacker, shapeXpValue(shape, now));
                }
                resetShape(shape);
            }
        }

        function damageTankTarget(tank, damage, attacker, now) {
            tank.hp -= damage;
            tank.lastHitAt = now;

            if (attacker) {
                healFromHit(attacker, now);
            }

            if (tank.hp <= 0) {
                killTank(tank, attacker, now);
            }
        }

        function damageBossTarget(damage, attacker, now) {
            if (!boss) {
                return;
            }

            boss.hp -= damage;
            boss.lastHitBy = attacker;

            if (attacker) {
                healFromHit(attacker, now);
            }

            if (boss.hp <= 0) {
                destroyBoss(now);
            }
        }

        function damageBossEscort(escort, damage, attacker, now) {
            escort.hp -= damage;
            escort.lastHitBy = attacker;

            if (attacker) {
                healFromHit(attacker, now);
            }
        }

        function damageBossShield(shield, damage) {
            shield.hp -= damage;
        }

        function explodeBullet(bullet, now) {
            if (!bullet.active) {
                return;
            }

            const radius = bullet.explosiveRadius;
            bullet.active = false;

            if (!radius) {
                return;
            }

            addExplosion(bullet.x, bullet.y, radius, bullet.explosionColor, now);

            for (let i = 0; i < bossShields.length; i += 1) {
                const shield = bossShields[i];
                const hitDist = radius + shield.radius;
                if (distSq(bullet.x, bullet.y, shield.x, shield.y) <= hitDist * hitDist) {
                    damageBossShield(shield, bullet.explosionDamage);
                }
            }

            for (let i = 0; i < bossEscorts.length; i += 1) {
                const escort = bossEscorts[i];
                const hitDist = radius + escort.radius;
                if (distSq(bullet.x, bullet.y, escort.x, escort.y) <= hitDist * hitDist) {
                    damageBossEscort(escort, bullet.explosionDamage, bullet.owner, now);
                }
            }

            if (boss && !bullet.isBoss && bullet.owner !== boss) {
                const bossHitDist = radius + boss.radius;
                if (distSq(bullet.x, bullet.y, boss.x, boss.y) <= bossHitDist * bossHitDist) {
                    damageBossTarget(bullet.explosionDamage, bullet.owner, now);
                }
            }

            for (let s = 0; s < shapes.length; s += 1) {
                const shape = shapes[s];
                if (!shape.alive) {
                    continue;
                }

                const hitDist = radius + shape.r;
                if (distSq(bullet.x, bullet.y, shape.x, shape.y) <= hitDist * hitDist) {
                    damageShapeTarget(shape, bullet.explosionDamage, bullet.owner, now);
                }
            }

            const tanks = [player].concat(bots);
            for (let t = 0; t < tanks.length; t += 1) {
                const tank = tanks[t];
                if (!tank.alive || tank === bullet.owner) {
                    continue;
                }

                const hitDist = radius + tank.radius;
                if (distSq(bullet.x, bullet.y, tank.x, tank.y) <= hitDist * hitDist) {
                    damageTankTarget(tank, bullet.explosionDamage, bullet.owner, now);
                }
            }
        }

        function hitShape(shape, bullet, now) {
            if (bullet.explosiveRadius) {
                explodeBullet(bullet, now);
                return;
            }

            damageShapeTarget(shape, bullet.damage, bullet.owner, now);
            bullet.active = false;
        }

        function hitTank(tank, bullet, now) {
            if (bullet.explosiveRadius) {
                explodeBullet(bullet, now);
                return;
            }

            damageTankTarget(tank, bullet.damage, bullet.owner, now);
            bullet.active = false;
        }

        function hitBoss(bullet, now) {
            if (bullet.explosiveRadius) {
                explodeBullet(bullet, now);
                return;
            }

            damageBossTarget(bullet.damage, bullet.owner, now);
            bullet.active = false;
        }

        function updateEffects(now) {
            for (let i = beams.length - 1; i >= 0; i -= 1) {
                if (now >= beams[i].expiresAt) {
                    beams.splice(i, 1);
                }
            }

            for (let i = explosions.length - 1; i >= 0; i -= 1) {
                if (now >= explosions[i].expiresAt) {
                    explosions.splice(i, 1);
                }
            }
        }

        function bounceBullet(bullet) {
            if (!bullet.bouncesRemaining) {
                return false;
            }

            let bounced = false;
            if (bullet.x <= bullet.r) {
                bullet.x = bullet.r;
                bullet.vx = Math.abs(bullet.vx);
                bounced = true;
            } else if (bullet.x >= CONFIG.worldSize - bullet.r) {
                bullet.x = CONFIG.worldSize - bullet.r;
                bullet.vx = -Math.abs(bullet.vx);
                bounced = true;
            }

            if (bullet.y <= bullet.r) {
                bullet.y = bullet.r;
                bullet.vy = Math.abs(bullet.vy);
                bounced = true;
            } else if (bullet.y >= CONFIG.worldSize - bullet.r) {
                bullet.y = CONFIG.worldSize - bullet.r;
                bullet.vy = -Math.abs(bullet.vy);
                bounced = true;
            }

            if (bounced) {
                bullet.bouncesRemaining -= 1;
                bullet.startX = bullet.x;
                bullet.startY = bullet.y;
            }

            return bounced;
        }

        function updateBullets(now, dt) {
            for (let i = 0; i < bullets.length; i += 1) {
                const bullet = bullets[i];
                if (!bullet.active) {
                    continue;
                }

                bullet.x += bullet.vx * dt;
                bullet.y += bullet.vy * dt;

                bounceBullet(bullet);

                if (now >= bullet.expireAt ||
                    bullet.x < -20 || bullet.y < -20 ||
                    bullet.x > CONFIG.worldSize + 20 || bullet.y > CONFIG.worldSize + 20 ||
                    distSq(bullet.x, bullet.y, bullet.startX, bullet.startY) > bullet.maxDistance * bullet.maxDistance) {
                    if (bullet.explosiveRadius) {
                        explodeBullet(bullet, now);
                    } else {
                        bullet.active = false;
                    }
                    continue;
                }

                if (!bullet.isBoss) {
                    for (let shieldIndex = 0; shieldIndex < bossShields.length; shieldIndex += 1) {
                        const shield = bossShields[shieldIndex];
                        const shieldHitDist = bullet.r + shield.radius;
                        if (distSq(bullet.x, bullet.y, shield.x, shield.y) <= shieldHitDist * shieldHitDist) {
                            damageBossShield(shield, bullet.damage);
                            bullet.active = false;
                            break;
                        }
                    }
                }

                if (!bullet.active) {
                    continue;
                }

                if (boss && !bullet.isBoss && bullet.owner !== boss) {
                    const bossHitDist = bullet.r + boss.radius;
                    if (distSq(bullet.x, bullet.y, boss.x, boss.y) <= bossHitDist * bossHitDist) {
                        hitBoss(bullet, now);
                    }
                }

                if (!bullet.active) {
                    continue;
                }

                if (!bullet.isBoss) {
                    for (let escortIndex = 0; escortIndex < bossEscorts.length; escortIndex += 1) {
                        const escort = bossEscorts[escortIndex];
                        const hitDist = bullet.r + escort.radius;
                        if (distSq(bullet.x, bullet.y, escort.x, escort.y) <= hitDist * hitDist) {
                            damageBossEscort(escort, bullet.damage, bullet.owner, now);
                            bullet.active = false;
                            break;
                        }
                    }
                }

                if (!bullet.active) {
                    continue;
                }

                if (!bullet.isBoss) {
                    for (let s = 0; s < shapes.length; s += 1) {
                        const shape = shapes[s];
                        if (!shape.alive) {
                            continue;
                        }
                        const hitDist = bullet.r + shape.r;
                        if (distSq(bullet.x, bullet.y, shape.x, shape.y) <= hitDist * hitDist) {
                            hitShape(shape, bullet, now);
                            break;
                        }
                    }
                }

                if (!bullet.active) {
                    continue;
                }

                const tanks = [player].concat(bots);
                for (let t = 0; t < tanks.length; t += 1) {
                    const tank = tanks[t];
                    if (!tank.alive || tank === bullet.owner) {
                        continue;
                    }

                    const hitDist = bullet.r + tank.radius;
                    if (distSq(bullet.x, bullet.y, tank.x, tank.y) <= hitDist * hitDist) {
                        hitTank(tank, bullet, now);
                        break;
                    }
                }
            }
        }

        function updateShapes(dt) {
            for (let i = 0; i < shapes.length; i += 1) {
                shapes[i].rotation += shapes[i].spin * dt;
            }
        }

        function updateCamera(now, dt) {
            if (camera.tauntTarget && now >= camera.tauntUntil) {
                clearCameraTaunt();
            }

            let follow = player.alive ? player : null;
            camera.targetZoom = 1;

            if (!follow && camera.tauntTarget && camera.tauntTarget.alive) {
                follow = camera.tauntTarget;
                camera.targetZoom = CONFIG.deathZoomScale;
            } else if (!follow && player) {
                follow = player;
            }

            if (!follow) {
                return;
            }

            const lerp = 1 - Math.pow(0.001, dt);
            const zoomLerp = 1 - Math.pow(0.0004, dt);
            camera.x += (follow.x - camera.x) * lerp;
            camera.y += (follow.y - camera.y) * lerp;
            camera.zoom += (camera.targetZoom - camera.zoom) * zoomLerp;

            const halfWidth = (canvasWidth * 0.5) / camera.zoom;
            const halfHeight = (canvasHeight * 0.5) / camera.zoom;
            camera.x = clamp(camera.x, halfWidth, CONFIG.worldSize - halfWidth);
            camera.y = clamp(camera.y, halfHeight, CONFIG.worldSize - halfHeight);
        }

        function updateHud(now) {
            const playerMutatorActive = tankHasMutator(player, now);
            const playerMutatorDef = playerMutatorActive ? mutatorDef(player.mutatorType) : null;
            const mutatorSeconds = playerMutatorActive ? Math.ceil((player.mutatorUntil - now) / 1000) : 0;
            const playerBoostActive = tankHasPickupBoost(player, now);
            const boostSeconds = playerBoostActive ? Math.ceil((player.pickupBoostUntil - now) / 1000) : 0;
            const inHotZone = tankInsideHotZone(player);
            const shapeBonusPercent = Math.max(0, Math.round((shapeXpBonusMultiplier(now) - 1) * 100));
            const railChargePercent = player.advancedType === "railgun" ? Math.round(railgunChargeRatio(player, now) * 100) : 0;
            const mutatorText = playerMutatorActive ? ` • ${player.mutatorLabel} ${mutatorSeconds}s` : "";
            const boostText = playerBoostActive ? ` • ${player.pickupBoostLabel} ${boostSeconds}s` : "";
            const railChargeText = player.advancedType === "railgun" ? ` • Charge ${railChargePercent}%` : "";

            levelValue.textContent = player.level.toString();
            hpValue.textContent = `HP ${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
            pointsValue.textContent = `Points ${player.skillPoints} • ${player.classLabel}${mutatorText}${boostText}${railChargeText}`;
            xpFill.style.width = `${(player.xp / player.xpNext) * 100}%`;
            xpText.textContent = inHotZone ?
                `XP ${Math.floor(player.xp)} / ${player.xpNext} • HOT x3` :
                `XP ${Math.floor(player.xp)} / ${player.xpNext} • Shapes +${shapeBonusPercent}%`;

            statCounts.damage.textContent = player.statLevels.damage.toString();
            statCounts.reload.textContent = player.statLevels.reload.toString();
            statCounts.health.textContent = player.statLevels.health.toString();
            statCounts.speed.textContent = player.statLevels.speed.toString();

            for (let index = 0; index < statButtons.length; index += 1) {
                statButtons[index].disabled = player.skillPoints <= 0 || !player.alive || evolutionOpen();
            }

            if (boss) {
                bossHud.hidden = false;
                const escortInfo = bossEscorts.length ? ` • +${bossEscorts.length} bosses` : "";
                bossTitle.textContent = bossShields.length ?
                    `${boss.name} Mk ${boss.tier} • ${boss.burstCount} burst • ${bossShields.length} shields${escortInfo}` :
                    `${boss.name} Mk ${boss.tier} • ${boss.burstCount} burst${escortInfo}`;
                bossFill.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
            } else {
                bossHud.hidden = true;
            }

            if (eventNotice.text && now < eventNotice.until) {
                noticeText.textContent = eventNotice.text;
            } else if (!player.alive && camera.tauntTarget && now < camera.tauntUntil) {
                noticeText.textContent = `${camera.tauntTarget.name} was your target. Enjoy the zoom.`;
            } else if (!player.alive && now < deadUntil) {
                noticeText.textContent = "You were destroyed. Respawning...";
            } else if (evolutionOpen()) {
                noticeText.textContent = pendingEvolutionTier === 2 ? "Choose your second evolution." : "Choose your evolution.";
            } else if (shapeSwarm.active) {
                noticeText.textContent = "Shape Swarm active: triangles and pentagons are spilling around you.";
            } else if (hotZone.active) {
                noticeText.textContent = "Hot zone: x3 XP, but it burns HP and drags bots in.";
            } else if (playerBoostActive) {
                noticeText.textContent = `${player.pickupBoostLabel}: map pickup active for ${boostSeconds}s.`;
            } else if (playerMutatorActive && playerMutatorDef) {
                noticeText.textContent = `${player.mutatorLabel}: ${playerMutatorDef.detail}`;
            } else if (boss) {
                noticeText.textContent = "Boss wave live. Kill the main boss for 3 levels and a mutator.";
            } else if (player.classType && !player.advancedType && player.level >= 40) {
                noticeText.textContent = "Push level 50 for your second evolution.";
            } else if (nemesis.bot) {
                noticeText.textContent = `${nemesis.bot.name} is marked Цель. Kill it for heal + 1 level.`;
            } else if (aimInput.aiming || aimInput.active) {
                noticeText.textContent = "Mouse or right stick aims. Hold to auto-fire.";
            } else if (player.level >= 6) {
                noticeText.textContent = "Higher level = stronger bullets and tank.";
            } else {
                noticeText.textContent = "Farm shapes. Arrows move on PC. Hold mouse or right stick to shoot.";
            }
        }

        function drawGrid() {
            const spacing = 72 * camera.zoom;
            const offsetX = ((worldToScreenX(0) % spacing) + spacing) % spacing;
            const offsetY = ((worldToScreenY(0) % spacing) + spacing) % spacing;

            ctx.strokeStyle = "rgba(255,255,255,0.04)";
            ctx.lineWidth = 1;
            ctx.beginPath();

            for (let x = offsetX; x <= canvasWidth; x += spacing) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvasHeight);
            }

            for (let y = offsetY; y <= canvasHeight; y += spacing) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvasWidth, y);
            }

            ctx.stroke();
        }

        function drawWorldBorder() {
            const x = worldToScreenX(0);
            const y = worldToScreenY(0);
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, CONFIG.worldSize * camera.zoom, CONFIG.worldSize * camera.zoom);
        }

        function drawHotZone(now) {
            if (!hotZone.active) {
                return;
            }

            const sx = worldToScreenX(hotZone.x);
            const sy = worldToScreenY(hotZone.y);
            const radius = hotZone.radius * camera.zoom;
            const pulse = 0.94 + (Math.sin(now * 0.008) * 0.06);
            const gradient = ctx.createRadialGradient(sx, sy, radius * 0.22, sx, sy, radius * pulse);
            gradient.addColorStop(0, "rgba(255, 128, 82, 0.34)");
            gradient.addColorStop(0.6, "rgba(255, 106, 72, 0.14)");
            gradient.addColorStop(1, "rgba(255, 106, 72, 0.02)");

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(sx, sy, radius * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 183, 112, 0.88)";
            ctx.lineWidth = Math.max(2, 3 * camera.zoom);
            ctx.beginPath();
            ctx.arc(sx, sy, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.save();
            ctx.setLineDash([12, 9]);
            ctx.strokeStyle = "rgba(255, 220, 178, 0.58)";
            ctx.lineWidth = Math.max(1.5, 2 * camera.zoom);
            ctx.beginPath();
            ctx.arc(sx, sy, radius * 0.72, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = "#ffd9b4";
            ctx.font = "800 12px system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HOT ZONE", sx, sy - radius - 14);
        }

        function drawBoost(boost, now) {
            const sx = worldToScreenX(boost.x);
            const sy = worldToScreenY(boost.y);
            const radius = boost.r * camera.zoom;
            const pulse = 1 + (Math.sin((now - boost.spawnedAt) * 0.01) * 0.09);

            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.fillStyle = boost.color;
            ctx.beginPath();
            ctx.arc(sx, sy, radius * 1.85 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(boost.rotation);
            ctx.fillStyle = boost.color;
            ctx.strokeStyle = boost.stroke;
            ctx.lineWidth = Math.max(1.4, 2 * camera.zoom);
            ctx.beginPath();
            for (let i = 0; i < 4; i += 1) {
                const angle = (Math.PI * 0.5 * i);
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = "#f4fbff";
            ctx.font = "800 10px system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(boost.label, sx, sy - (radius + 12));
        }

        function drawShape(shape) {
            if (!shape.alive) {
                return;
            }

            const sx = worldToScreenX(shape.x);
            const sy = worldToScreenY(shape.y);
            const sides = shape.sides;
            const radius = shape.r * camera.zoom;

            ctx.fillStyle = shape.color;
            ctx.strokeStyle = shape.stroke;
            ctx.lineWidth = Math.max(1.5, 2 * camera.zoom);
            ctx.beginPath();

            for (let i = 0; i < sides; i += 1) {
                const angle = shape.rotation + ((Math.PI * 2) / sides) * i;
                const x = sx + Math.cos(angle) * radius;
                const y = sy + Math.sin(angle) * radius;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawBullet(bullet) {
            ctx.fillStyle = bullet.color;
            ctx.beginPath();
            ctx.arc(worldToScreenX(bullet.x), worldToScreenY(bullet.y), bullet.r * camera.zoom, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBeams(now) {
            for (let i = 0; i < beams.length; i += 1) {
                const beam = beams[i];
                const life = Math.max(0, (beam.expiresAt - now) / 110);
                ctx.save();
                ctx.strokeStyle = beam.color;
                ctx.globalAlpha = 0.25 + (life * 0.75);
                ctx.lineWidth = Math.max(4, 8 * camera.zoom * life);
                ctx.beginPath();
                ctx.moveTo(worldToScreenX(beam.x1), worldToScreenY(beam.y1));
                ctx.lineTo(worldToScreenX(beam.x2), worldToScreenY(beam.y2));
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawExplosions(now) {
            for (let i = 0; i < explosions.length; i += 1) {
                const explosion = explosions[i];
                const life = Math.max(0, (explosion.expiresAt - now) / 180);
                const radius = explosion.radius * camera.zoom * (1.15 - (life * 0.25));
                ctx.save();
                ctx.strokeStyle = explosion.color;
                ctx.globalAlpha = 0.18 + (life * 0.34);
                ctx.lineWidth = Math.max(2, 5 * camera.zoom * life);
                ctx.beginPath();
                ctx.arc(worldToScreenX(explosion.x), worldToScreenY(explosion.y), radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawBadge(text, x, y, fill, stroke) {
            ctx.save();
            ctx.font = "800 11px system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif";
            ctx.textAlign = "center";
            const textWidth = ctx.measureText(text).width;
            const width = textWidth + 14;
            const height = 20;
            const left = x - (width * 0.5);
            const top = y - height;
            const radius = 10;

            ctx.fillStyle = fill;
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(left + radius, top);
            ctx.lineTo(left + width - radius, top);
            ctx.arcTo(left + width, top, left + width, top + radius, radius);
            ctx.lineTo(left + width, top + height - radius);
            ctx.arcTo(left + width, top + height, left + width - radius, top + height, radius);
            ctx.lineTo(left + radius, top + height);
            ctx.arcTo(left, top + height, left, top + height - radius, radius);
            ctx.lineTo(left, top + radius);
            ctx.arcTo(left, top, left + radius, top, radius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#07111c";
            ctx.fillText(text, x, y - 6);
            ctx.restore();
        }

        function drawTankBadges(tank, sx, sy, bodyRadius, now) {
            let badgeY = sy - bodyRadius - 14;

            if (isNemesis(tank)) {
                const markerRadius = bodyRadius + 10;
                ctx.save();
                ctx.strokeStyle = "rgba(255, 125, 96, 0.95)";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(sx, sy, markerRadius, 0, Math.PI * 2);
                ctx.moveTo(sx - markerRadius - 8, sy);
                ctx.lineTo(sx - markerRadius + 4, sy);
                ctx.moveTo(sx + markerRadius - 4, sy);
                ctx.lineTo(sx + markerRadius + 8, sy);
                ctx.moveTo(sx, sy - markerRadius - 8);
                ctx.lineTo(sx, sy - markerRadius + 4);
                ctx.moveTo(sx, sy + markerRadius - 4);
                ctx.lineTo(sx, sy + markerRadius + 8);
                ctx.stroke();
                ctx.restore();

                drawBadge("Цель", sx, badgeY, "#ff8965", "rgba(255,255,255,0.18)");
                badgeY -= 24;
            }

            if (tankHasMutator(tank, now)) {
                drawBadge(tank.mutatorLabel, sx, badgeY, tank.mutatorColor, "rgba(255,255,255,0.14)");
                badgeY -= 24;
            }

            if (tankHasPickupBoost(tank, now)) {
                drawBadge(tank.pickupBoostLabel, sx, badgeY, tank.pickupBoostColor, "rgba(255,255,255,0.14)");
            }
        }

        function drawTank(tank, now) {
            if (!tank.alive) {
                return;
            }

            const sx = worldToScreenX(tank.x);
            const sy = worldToScreenY(tank.y);
            const barrelLength = tank.barrelLength * camera.zoom;
            const barrelWidth = 12 * camera.zoom;
            const bodyRadius = tank.radius * camera.zoom;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(tank.barrelAngle);
            ctx.fillStyle = tank.barrelColor;
            ctx.fillRect(0, -barrelWidth * 0.5, barrelLength, barrelWidth);
            ctx.restore();

            ctx.fillStyle = tank.bodyColor;
            ctx.beginPath();
            ctx.arc(sx, sy, bodyRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.16)";
            ctx.lineWidth = Math.max(1.5, 2 * camera.zoom);
            ctx.stroke();

            drawTankBadges(tank, sx, sy, bodyRadius, now);
        }

        function drawBoss() {
            if (!boss) {
                return;
            }

            const sx = worldToScreenX(boss.x);
            const sy = worldToScreenY(boss.y);
            const tailWidth = 42 * camera.zoom;
            const tailHeight = 12 * camera.zoom;
            const rotorReach = 36 * camera.zoom;
            const barrelWidth = 16 * camera.zoom;
            const barrelLength = boss.barrelLength * camera.zoom;
            const bodyRadius = boss.radius * camera.zoom;

            ctx.save();
            ctx.translate(sx, sy);

            ctx.fillStyle = boss.bodyColor;
            ctx.fillRect(-14 * camera.zoom, -6 * camera.zoom, -tailWidth, tailHeight);

            ctx.rotate(boss.rotor);
            ctx.strokeStyle = "rgba(255,255,255,0.55)";
            ctx.lineWidth = Math.max(2, 4 * camera.zoom);
            ctx.beginPath();
            ctx.moveTo(-rotorReach, 0);
            ctx.lineTo(rotorReach, 0);
            ctx.moveTo(0, -rotorReach);
            ctx.lineTo(0, rotorReach);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(boss.barrelAngle);
            ctx.fillStyle = boss.barrelColor;
            ctx.fillRect(0, -barrelWidth * 0.5, barrelLength, barrelWidth);
            ctx.restore();

            ctx.fillStyle = boss.bodyColor;
            ctx.beginPath();
            ctx.arc(sx, sy, bodyRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = Math.max(1.5, 3 * camera.zoom);
            ctx.stroke();
        }

        function drawBossEscorts() {
            for (let i = 0; i < bossEscorts.length; i += 1) {
                const escort = bossEscorts[i];
                const sx = worldToScreenX(escort.x);
                const sy = worldToScreenY(escort.y);
                const bodyRadius = escort.radius * camera.zoom;
                const barrelLength = escort.barrelLength * camera.zoom;
                const barrelWidth = 10 * camera.zoom;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(escort.barrelAngle);
                ctx.fillStyle = escort.barrelColor;
                ctx.fillRect(0, -barrelWidth * 0.5, barrelLength, barrelWidth);
                ctx.restore();

                ctx.fillStyle = escort.bodyColor;
                ctx.beginPath();
                ctx.arc(sx, sy, bodyRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.18)";
                ctx.lineWidth = Math.max(1.2, 2 * camera.zoom);
                ctx.stroke();
            }
        }

        function drawBossShields() {
            for (let i = 0; i < bossShields.length; i += 1) {
                const shield = bossShields[i];
                const sx = worldToScreenX(shield.x);
                const sy = worldToScreenY(shield.y);
                const radius = shield.radius * camera.zoom;

                ctx.fillStyle = "#4c86ff";
                ctx.strokeStyle = "#cfdcff";
                ctx.lineWidth = Math.max(1.5, 2.2 * camera.zoom);
                ctx.beginPath();

                for (let side = 0; side < 5; side += 1) {
                    const angle = shield.rotation + ((Math.PI * 2) / 5) * side;
                    const x = sx + Math.cos(angle) * radius;
                    const y = sy + Math.sin(angle) * radius;
                    if (side === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // Render order stays intentionally simple and cheap.
        function render() {
            const now = performance.now();
            ctx.fillStyle = "#0b111b";
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            drawGrid();
            drawWorldBorder();
            drawHotZone(now);

            for (let i = 0; i < shapes.length; i += 1) {
                drawShape(shapes[i]);
            }

            for (let i = 0; i < boosts.length; i += 1) {
                drawBoost(boosts[i], now);
            }

            for (let i = 0; i < bullets.length; i += 1) {
                if (bullets[i].active) {
                    drawBullet(bullets[i]);
                }
            }

            drawExplosions(now);
            drawBeams(now);

            drawBossShields();
            drawBossEscorts();
            drawBoss();

            for (let i = 0; i < bots.length; i += 1) {
                drawTank(bots[i], now);
            }
            drawTank(player, now);
        }

        function handleStickMove(state, input, stickEl, clientX, clientY) {
            const dx = clientX - state.x;
            const dy = clientY - state.y;
            const dist = Math.hypot(dx, dy);
            const limit = state.radius;
            const scale = dist > limit ? (limit / dist) : 1;
            const px = dx * scale;
            const py = dy * scale;

            stickEl.style.transform = `translate3d(${px}px, ${py}px, 0)`;
            input.x = clamp(px / limit, -1, 1);
            input.y = clamp(py / limit, -1, 1);
        }

        function resetStick(state, input, stickEl) {
            state.pointerId = null;
            input.x = 0;
            input.y = 0;
            input.active = false;
            stickEl.style.transform = "translate3d(0, 0, 0)";
        }

        function bindPad(pad, stickEl, state, input, syncInput) {
            pad.addEventListener("pointerdown", function (event) {
                const rect = pad.getBoundingClientRect();
                state.pointerId = event.pointerId;
                state.x = rect.left + (rect.width * 0.5);
                state.y = rect.top + (rect.height * 0.5);
                state.radius = rect.width * 0.34;
                input.active = true;
                pad.setPointerCapture(event.pointerId);
                handleStickMove(state, input, stickEl, event.clientX, event.clientY);
                syncInput();
            });

            pad.addEventListener("pointermove", function (event) {
                if (state.pointerId === event.pointerId) {
                    handleStickMove(state, input, stickEl, event.clientX, event.clientY);
                    syncInput();
                }
            });

            pad.addEventListener("pointerup", function (event) {
                if (state.pointerId === event.pointerId) {
                    resetStick(state, input, stickEl);
                    syncInput();
                }
            });

            pad.addEventListener("pointercancel", function (event) {
                if (state.pointerId === event.pointerId) {
                    resetStick(state, input, stickEl);
                    syncInput();
                }
            });
        }

        function setKeyboardMove(code, pressed) {
            if (code === "ArrowLeft") {
                keyboardMoveState.left = pressed;
            } else if (code === "ArrowRight") {
                keyboardMoveState.right = pressed;
            } else if (code === "ArrowUp") {
                keyboardMoveState.up = pressed;
            } else if (code === "ArrowDown") {
                keyboardMoveState.down = pressed;
            } else {
                return false;
            }

            syncMoveInput();
            return true;
        }

        function updateMouseAim(event) {
            if (!player) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const pointerX = event.clientX - rect.left;
            const pointerY = event.clientY - rect.top;
            const dx = pointerX - worldToScreenX(player.x);
            const dy = pointerY - worldToScreenY(player.y);
            const vector = normalizeVector(dx, dy);

            mouseAimState.x = vector.x;
            mouseAimState.y = vector.y;
            mouseAimState.aiming = Math.hypot(dx, dy) > 4;
            syncAimInput();
        }

        function clearDesktopInput() {
            keyboardMoveState.left = false;
            keyboardMoveState.right = false;
            keyboardMoveState.up = false;
            keyboardMoveState.down = false;
            mouseAimState.x = 0;
            mouseAimState.y = 0;
            mouseAimState.aiming = false;
            mouseAimState.firing = false;
            syncMoveInput();
            syncAimInput();
        }

        function init() {
            const now = performance.now();
            resize();
            createShapes();
            createActors(now);
            syncMoveInput();
            syncAimInput();
            camera.x = player.x;
            camera.y = player.y;
            updateHud(now);
            requestAnimationFrame(loop);
        }

        function loop(now) {
            const dt = Math.min((now - lastFrame) / 1000, 0.05);
            lastFrame = now;

            if (evolutionOpen()) {
                updateHud(now);
                render();
                requestAnimationFrame(loop);
                return;
            }

            updatePlayer(now, dt);
            updateShapeSwarm(now);
            updateBots(now, dt);
            updateBoosts(now, dt);
            updateNemesis(now);
            updateBoss(now, dt);
            updateBossEscorts(now, dt);
            updateBossShields(dt);
            resolveTankSeparation();
            updateBullets(now, dt);
            updateShapes(dt);
            updateHotZone(now, dt);
            updateMutators(now);
            updateEffects(now);
            updateAutoHeal(now, dt);
            updateCamera(now, dt);

            hudTimer += dt * 1000;
            if (hudTimer >= CONFIG.hudRate) {
                hudTimer = 0;
                updateHud(now);
            }

            noticeTimer += dt * 1000;
            if (noticeTimer >= CONFIG.noticeRate) {
                noticeTimer = 0;
                updateHud(now);
            }

            render();
            requestAnimationFrame(loop);
        }

        bindPad(movePad, moveStick, moveTouch, moveTouchInput, syncMoveInput);
        bindPad(aimPad, aimStick, aimTouch, aimTouchInput, syncAimInput);

        window.addEventListener("keydown", function (event) {
            if (setKeyboardMove(event.code, true)) {
                event.preventDefault();
            }
        });

        window.addEventListener("keyup", function (event) {
            if (setKeyboardMove(event.code, false)) {
                event.preventDefault();
            }
        });

        canvas.addEventListener("mousemove", updateMouseAim);
        canvas.addEventListener("mousedown", function (event) {
            if (event.button !== 0) {
                return;
            }

            updateMouseAim(event);
            mouseAimState.firing = true;
            syncAimInput();
        });

        canvas.addEventListener("mouseleave", function () {
            if (!mouseAimState.firing) {
                mouseAimState.x = 0;
                mouseAimState.y = 0;
                mouseAimState.aiming = false;
                syncAimInput();
            }
        });

        window.addEventListener("mouseup", function (event) {
            if (event.button !== 0) {
                return;
            }

            mouseAimState.firing = false;
            syncAimInput();
        });

        for (let index = 0; index < statButtons.length; index += 1) {
            statButtons[index].addEventListener("click", function () {
                spendStatPoint(statButtons[index].dataset.stat);
                updateHud(performance.now());
            });
        }

        for (let index = 0; index < choiceButtons.length; index += 1) {
            choiceButtons[index].addEventListener("click", function () {
                chooseEvolution(choiceButtons[index].dataset.class);
                updateHud(performance.now());
            });
        }

        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", function () {
            lastFrame = performance.now();
        });
        window.addEventListener("blur", function () {
            clearDesktopInput();
            lastFrame = performance.now();
        });

        init();
    </script>
</body>
</html>
