  blockMesh.castShadow = true;
  scene.add(blockMesh);

  const blockEdgeMat = new THREE.LineBasicMaterial({ linewidth: 2 });
  const blockEdges = new THREE.EdgesGeometry(blockGeo);
  const blockLine = new THREE.LineSegments(blockEdges, blockEdgeMat);
  scene.add(blockLine);

  // --- 3. ЗАГРУЗКА УРОВНЯ ---
  function loadLevel(index) {
    mapTiles3D.forEach(obj => scene.remove(obj));
    mapTiles3D = [];

    const level = levels[index];
    currentMap = level.map;
    rows = currentMap.length;
    cols = currentMap[0].length;
    
    offsetX = -cols / 2 + 0.5;
    offsetZ = -rows / 2 + 0.5;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const tileType = currentMap[y][x];
        if (tileType === 1) {
          const tileMesh = new THREE.Mesh(tileGeo, tileMat);
          tileMesh.position.set(x + offsetX, -0.1, y + offsetZ);
          tileMesh.receiveShadow = true;
          scene.add(tileMesh);
          mapTiles3D.push(tileMesh);

          const edges = new THREE.EdgesGeometry(tileGeo);
          const line = new THREE.LineSegments(edges, edgeMat);
          line.position.copy(tileMesh.position);
          scene.add(line);
          mapTiles3D.push(line);
        } else if (tileType === 2) {
          const holeGeo = new THREE.BoxGeometry(1, 0.1, 1);
          const holeMesh = new THREE.Mesh(holeGeo, holeMat);
          holeMesh.position.set(x + offsetX, -0.15, y + offsetZ);
          scene.add(holeMesh);
          mapTiles3D.push(holeMesh);
        }
      }
    }

    // Автоматический расчет дистанции под размер карты и экран устройства
    const maxDim = Math.max(cols, rows);
    const aspect = window.innerWidth / window.innerHeight;
    let distance = maxDim * 1.2; // Базовый множитель отдаления
    
    if (aspect < 1) {
      // Если экран вертикальный (смартфон), отодвигаем камеру еще дальше, чтобы всё влезло по ширине
      distance = distance / aspect;
    }
    distance = Math.max(distance, 11); // Ограничение: не приближать слишком близко на мелких уровнях

    camera.position.set(0, distance, distance);
    camera.lookAt(0, -0.5, 0);

    block.x = level.start.x;
    block.y = level.start.y;
    block.state = 'STANDING';
    gameOver = false;
    isTransitioning = false;

    updateBlock3D();
  }

  function getTile(x, y) {
    if (y < 0 || y >= rows || x < 0 || x >= cols) return 0;
    return currentMap[y][x];
  }

  function updateBlock3D() {
    if (block.state === 'STANDING') {
      blockMesh.scale.set(1, 2, 1);
      blockMesh.position.set(block.x + offsetX, 1.0, block.y + offsetZ);
      blockMat.color.setHex(0xf1c40f);
      blockEdgeMat.color.setHex(0xd35400);
    } 
    else if (block.state === 'LYING_X') {
      blockMesh.scale.set(2, 1, 1);
      blockMesh.position.set(block.x + 0.5 + offsetX, 0.5, block.y + offsetZ);
      blockMat.color.setHex(0xe74c3c);
      blockEdgeMat.color.setHex(0xc0392b);
    } 
    else if (block.state === 'LYING_Y') {
      blockMesh.scale.set(1, 1, 2);
      blockMesh.position.set(block.x + offsetX, 0.5, block.y + 0.5 + offsetZ);
      blockMat.color.setHex(0xe74c3c);
      blockEdgeMat.color.setHex(0xc0392b);
    }
    blockLine.position.copy(blockMesh.position);
    blockLine.scale.copy(blockMesh.scale);
  }

  function checkWinLose() {
    let tilesUnder = [];
    
    if (block.state === 'STANDING') {
        tilesUnder.push(getTile(block.x, block.y));
    } else if (block.state === 'LYING_X') {
        tilesUnder.push(getTile(block.x, block.y));
        tilesUnder.push(getTile(block.x + 1, block.y));
    } else if (block.state === 'LYING_Y') {
        tilesUnder.push(getTile(block.x, block.y));
        tilesUnder.push(getTile(block.x, block.y + 1));
    }

    if (tilesUnder.includes(0)) {
      gameOver = true;
      isTransitioning = true;
      
      let fallY = blockMesh.position.y;
      function fall() {
        if (!isTransitioning) return; // <--- ПРЕРЫВАЕТ СТАРУЮ АНИМАЦИЮ
        if (fallY > -8) {
          fallY -= 0.25;
          blockMesh.position.y = fallY;
          blockLine.position.y = fallY;
          requestAnimationFrame(fall);
        }
      }
      fall();

      setTimeout(() => {
          loadLevel(currentLevelIndex);
      }, 1000);
    } 
    else if (block.state === 'STANDING' && tilesUnder[0] === 2) {
      gameOver = true;
      isTransitioning = true;

      let sinkY = blockMesh.position.y;
      function sink() {
        if (!isTransitioning) return; // <--- ПРЕРЫВАЕТ СТАРУЮ АНИМАЦИЮ
        if (sinkY > -0.9) {
          sinkY -= 0.1;
          blockMesh.position.y = sinkY;
          blockLine.position.y = sinkY;
          requestAnimationFrame(sink);
        }
      }
      sink();

      setTimeout(() => {
          currentLevelIndex++;
          if (currentLevelIndex >= levels.length) {
              currentLevelIndex = 0; // Если прошли всё, запускаем заново с 1 уровня
          }
          loadLevel(currentLevelIndex);
      }, 1500);
    }
  }

  function move(dx, dy) {
    if (gameOver || isTransitioning) return;

    if (block.state === 'STANDING') {
      if (dx === -1) { block.state = 'LYING_X'; block.x -= 2; }
      else if (dx === 1) { block.state = 'LYING_X'; block.x += 1; }
      else if (dy === -1) { block.state = 'LYING_Y'; block.y -= 2; }
      else if (dy === 1) { block.state = 'LYING_Y'; block.y += 1; }
    }
    else if (block.state === 'LYING_X') {
      if (dx === -1) { block.state = 'STANDING'; block.x -= 1; }
      else if (dx === 1) { block.state = 'STANDING'; block.x += 2; }
      else if (dy === -1) { block.y -= 1; }
      else if (dy === 1) { block.y += 1; }
    }
    else if (block.state === 'LYING_Y') {
      if (dx === -1) { block.x -= 1; }
      else if (dx === 1) { block.x += 1; }
      else if (dy === -1) { block.state = 'STANDING'; block.y -= 1; }
      else if (dy === 1) { block.state = 'STANDING'; block.y += 2; }
    }

    updateBlock3D();
    checkWinLose();
  }

  // --- УПРАВЛЕНИЕ КЛАВИАТУРОЙ (ПК) ---
  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'r') {
        loadLevel(currentLevelIndex);
        return;
    }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault(); 
    }
    if (e.key === 'ArrowUp') move(0, -1);
    if (e.key === 'ArrowDown') move(0, 1);
    if (e.key === 'ArrowLeft') move(-1, 0);
    if (e.key === 'ArrowRight') move(1, 0);
  });

  // --- СЕНСОРНОЕ УПРАВЛЕНИЕ (МОБИЛЬНЫЕ) ---
  window.addEventListener('touchstart', (e) => {
    // Проверка на двойной тап для перезапуска уровня
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;
    if (tapLength < 300 && tapLength > 0) {
      loadLevel(currentLevelIndex);
      e.preventDefault();
      return;
    }
    lastTapTime = currentTime;

    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;
    
    // Порог минимального свайпа, чтобы избежать случайных нажатий (30 пикселей)
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 30) {
        if (dx > 0) move(1, 0);  // Вправо
        else move(-1, 0);       // Влево
      }
    } else {
      if (Math.abs(dy) > 30) {
        if (dy > 0) move(0, 1);  // Вниз
        else move(0, -1);       // Вверх
      }
    }
  }, { passive: true });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    
    // Пересчитываем дистанцию камеры при повороте или изменении размера экрана
    const maxDim = Math.max(cols, rows);
    let distance = maxDim * 1.2;
    if (camera.aspect < 1) {
      distance = distance / camera.aspect;
    }
    distance = Math.max(distance, 11);
    
    camera.position.set(0, distance, distance);
    camera.lookAt(0, -0.5, 0);

    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  loadLevel(currentLevelIndex);
  animate();
</script>
</body>
