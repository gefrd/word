<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Connect 4 • Neon Arena</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px;
    touch-action: manipulation;
    overflow-x: hidden;
  }

  .game-header {
    width: 100%;
    max-width: 440px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px;
    margin-bottom: 8px;
  }

  .header-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.15s;
  }

  .header-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.2);
  }

  .title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .game-title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #f43f5e, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Mode selection */
  .mode-bar {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 8px;
  }

  .mode-btn {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 8px 4px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .mode-btn.active {
    background: #0284c7;
    border-color: #38bdf8;
    color: #fff;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  }

  /* Players scoreboard */
  .score-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 400px;
    gap: 10px;
    margin-bottom: 10px;
  }

  .player-card {
    flex: 1;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.25s;
  }

  .player-card.active.p1 {
    border-color: #f43f5e;
    box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    transform: translateY(-2px);
  }

  .player-card.active.p2 {
    border-color: #fbbf24;
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
    transform: translateY(-2px);
  }

  .p-disc {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .p-disc.red {
    background: radial-gradient(circle at 35% 35%, #ff4b6e, #be123c);
    box-shadow: 0 0 8px #f43f5e;
  }
  .p-disc.yellow {
    background: radial-gradient(circle at 35% 35%, #fde047, #d97706);
    box-shadow: 0 0 8px #fbbf24;
  }

  .p-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .p-name {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
  }

  .p-score {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    font-family: monospace;
    line-height: 1.1;
  }

  /* Board Area */
  .board-container {
    width: 100%;
    max-width: 400px;
    background: #0f172a;
    border: 2px solid #1e293b;
    border-radius: 18px;
    padding: 12px 10px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Column indicators for hover/tap */
  .col-selectors {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    width: 100%;
    margin-bottom: 6px;
    height: 26px;
  }

  .col-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .col-arrow:hover, .col-arrow.active {
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    transform: translateY(2px);
  }

  /* Connect 4 Grid (7 cols, 6 rows) */
  .grid-board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 7px;
    width: 100%;
    aspect-ratio: 7 / 6;
    background: #1e293b;
    padding: 8px;
    border-radius: 14px;
    border: 1px solid #334155;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
  }

  .cell {
    background: #090d16;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .disc {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: absolute;
    animation: dropIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  @keyframes dropIn {
    0% { transform: translateY(-300%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .disc.red {
    background: radial-gradient(circle at 35% 35%, #ff4b6e, #9f1239);
    border: 1.5px solid #fb7185;
    box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
  }

  .disc.yellow {
    background: radial-gradient(circle at 35% 35%, #fef08a, #b45309);
    border: 1.5px solid #fde047;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
  }

  .disc.winning {
    animation: pulseWin 0.6s infinite alternate;
  }

  @keyframes pulseWin {
    0% { transform: scale(0.92); box-shadow: 0 0 6px #fff; }
    100% { transform: scale(1.08); box-shadow: 0 0 20px #fff; }
  }

  /* Footer Controls */
  .footer-controls {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 400px;
    margin-top: 10px;
  }

  .action-btn {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .action-btn:active {
    transform: scale(0.96);
    background: #334155;
  }

  /* Status Banner */
  .status-banner {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    text-align: center;
    min-height: 20px;
  }
</style>
</head>
<body>

  <div class="game-header">
    <button class="header-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/arcade.html'" aria-label="Back">
      ←
    </button>
    <div class="title-wrap">
      <span style="font-size: 20px;">🔴🟡</span>
      <span class="game-title">CONNECT 4</span>
    </div>
    <button class="header-btn" onclick="toggleMute()" id="muteBtn" aria-label="Mute">
      🔊
    </button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('ai_easy')">VS AI (EASY)</button>
    <button class="mode-btn" onclick="setMode('ai_hard')">VS AI (HARD)</button>
    <button class="mode-btn" onclick="setMode('2p')">2 PLAYERS</button>
  </div>

  <div class="score-panel">
    <div class="player-card active p1" id="p1Card">
      <div class="p-disc red"></div>
      <div class="p-info">
        <span class="p-name" id="p1Label">Player 1</span>
        <span class="p-score" id="p1Score">0</span>
      </div>
    </div>
    <div class="player-card p2" id="p2Card">
      <div class="p-disc yellow"></div>
      <div class="p-info">
        <span class="p-name" id="p2Label">AI Bot</span>
        <span class="p-score" id="p2Score">0</span>
      </div>
    </div>
  </div>

  <div class="board-container">
    <div class="col-selectors" id="colSelectors"></div>
    <div class="grid-board" id="gridBoard"></div>
  </div>

  <div class="status-banner" id="statusBanner">Your turn (Red)</div>

  <div class="footer-controls">
    <button class="action-btn" onclick="undoMove()">
      <span>↩️</span> Undo
    </button>
    <button class="action-btn" onclick="resetBoard()">
      <span>🔄</span> New Round
    </button>
    <button class="action-btn" onclick="resetScores()">
      <span>🏆</span> Reset
    </button>
  </div>

<script>
// --- Web Audio Synthesizer ---
let audioCtx = null;
let isMuted = false;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (isMuted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'drop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      osc.frequency.setValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
      osc.start(now);
      osc.stop(now + 0.55);
    } else if (type === 'draw') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(150, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  } catch (e) {}
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
}

// --- Connect 4 Engine ---
const ROWS = 6;
const COLS = 7;
let board = [];
let currentPlayer = 1; // 1 = Red, 2 = Yellow
let isGameOver = false;
let moveHistory = [];
let scores = { p1: 0, p2: 0 };
let currentMode = 'ai_easy'; // 'ai_easy', 'ai_hard', '2p'

function initBoard() {
  board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
}

function setMode(mode) {
  initAudio();
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(mode));
  });

  const p2Label = document.getElementById('p2Label');
  if (mode === '2p') {
    p2Label.textContent = 'Player 2';
  } else if (mode === 'ai_easy') {
    p2Label.textContent = 'AI Easy';
  } else {
    p2Label.textContent = 'AI Master';
  }

  resetBoard();
}

function renderSelectors() {
  const colSelectors = document.getElementById('colSelectors');
  colSelectors.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const arrow = document.createElement('div');
    arrow.className = 'col-arrow';
    arrow.textContent = '▼';
    arrow.onclick = () => handleColumnClick(c);
    colSelectors.appendChild(arrow);
  }
}

function renderBoard() {
  const grid = document.getElementById('gridBoard');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.onclick = () => handleColumnClick(c);

      const val = board[r][c];
      if (val === 1) {
        const disc = document.createElement('div');
        disc.className = 'disc red';
        cell.appendChild(disc);
      } else if (val === 2) {
        const disc = document.createElement('div');
        disc.className = 'disc yellow';
        cell.appendChild(disc);
      }

      grid.appendChild(cell);
    }
  }
  updateUI();
}

function updateUI() {
  const p1Card = document.getElementById('p1Card');
  const p2Card = document.getElementById('p2Card');
  const status = document.getElementById('statusBanner');

  if (isGameOver) return;

  if (currentPlayer === 1) {
    p1Card.classList.add('active');
    p2Card.classList.remove('active');
    status.textContent = "Red's Turn";
    status.style.color = '#f43f5e';
  } else {
    p1Card.classList.remove('active');
    p2Card.classList.add('active');
    status.textContent = currentMode === '2p' ? "Yellow's Turn" : "AI Thinking...";
    status.style.color = '#fbbf24';
  }
}

function handleColumnClick(col) {
  initAudio();
  if (isGameOver) return;
  if (currentMode.startsWith('ai') && currentPlayer === 2) return;

  makeMove(col);
}

function makeMove(col) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][col] === 0) {
      board[r][col] = currentPlayer;
      moveHistory.push({ row: r, col: col, player: currentPlayer });
      playSound('drop');
      renderBoard();

      const winLine = checkWin(r, col, currentPlayer);
      if (winLine) {
        handleWin(currentPlayer, winLine);
        return true;
      }

      if (checkDraw()) {
        handleDraw();
        return true;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateUI();

      if (currentMode.startsWith('ai') && currentPlayer === 2) {
        setTimeout(aiTurn, 400);
      }
      return true;
    }
  }
  return false;
}

function undoMove() {
  if (moveHistory.length === 0 || isGameOver) return;

  if (currentMode.startsWith('ai')) {
    // Undo both AI move and Player move
    if (moveHistory.length >= 2) {
      const m1 = moveHistory.pop();
      board[m1.row][m1.col] = 0;
      const m2 = moveHistory.pop();
      board[m2.row][m2.col] = 0;
      currentPlayer = 1;
    } else {
      const m = moveHistory.pop();
      board[m.row][m.col] = 0;
      currentPlayer = 1;
    }
  } else {
    const last = moveHistory.pop();
    board[last.row][last.col] = 0;
    currentPlayer = last.player;
  }
  renderBoard();
}

function checkWin(row, col, player) {
  const directions = [
    [ [0, 1], [0, -1] ],   // Horizontal
    [ [1, 0], [-1, 0] ],   // Vertical
    [ [1, 1], [-1, -1] ],  // Diagonal \
    [ [1, -1], [-1, 1] ]   // Diagonal /
  ];

  for (const dir of directions) {
    let line = [{ row, col }];
    for (const [dr, dc] of dir) {
      let r = row + dr;
      let c = col + dc;
      while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
        line.push({ row: r, col: c });
        r += dr;
        c += dc;
      }
    }
    if (line.length >= 4) return line;
  }
  return null;
}

function checkDraw() {
  return board[0].every(cell => cell !== 0);
}

function handleWin(player, winLine) {
  isGameOver = true;
  playSound('win');

  winLine.forEach(pt => {
    const index = pt.row * COLS + pt.col;
    const cell = document.getElementById('gridBoard').children[index];
    if (cell && cell.firstChild) {
      cell.firstChild.classList.add('winning');
    }
  });

  const status = document.getElementById('statusBanner');
  if (player === 1) {
    scores.p1++;
    document.getElementById('p1Score').textContent = scores.p1;
    status.textContent = '🎉 Red Wins!';
    status.style.color = '#f43f5e';
  } else {
    scores.p2++;
    document.getElementById('p2Score').textContent = scores.p2;
    status.textContent = currentMode === '2p' ? '🎉 Yellow Wins!' : '🤖 AI Wins!';
    status.style.color = '#fbbf24';
  }
}

function handleDraw() {
  isGameOver = true;
  playSound('draw');
  const status = document.getElementById('statusBanner');
  status.textContent = "🤝 It's a Draw!";
  status.style.color = '#94a3b8';
}

function resetBoard() {
  initBoard();
  isGameOver = false;
  currentPlayer = 1;
  moveHistory = [];
  renderBoard();
}

function resetScores() {
  scores.p1 = 0;
  scores.p2 = 0;
  document.getElementById('p1Score').textContent = '0';
  document.getElementById('p2Score').textContent = '0';
  resetBoard();
}

// --- AI Bot (Smart Minimax / Heuristic) ---
function aiTurn() {
  if (isGameOver) return;

  let chosenCol = -1;

  if (currentMode === 'ai_easy') {
    // Check if AI can win immediately
    for (let c = 0; c < COLS; c++) {
      if (canPlace(c) && willWin(c, 2)) { chosenCol = c; break; }
    }
    // Check if AI must block player win
    if (chosenCol === -1) {
      for (let c = 0; c < COLS; c++) {
        if (canPlace(c) && willWin(c, 1)) { chosenCol = c; break; }
      }
    }
    // Random valid column
    if (chosenCol === -1) {
      const validCols = [];
      for (let c = 0; c < COLS; c++) if (canPlace(c)) validCols.push(c);
      chosenCol = validCols[Math.floor(Math.random() * validCols.length)];
    }
  } else {
    // AI Hard - Center Priority + 3-ply Minimax lookahead
    chosenCol = getBestMoveMinimax();
  }

  if (chosenCol !== -1) {
    makeMove(chosenCol);
  }
}

function canPlace(c) {
  return board[0][c] === 0;
}

function willWin(c, player) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][c] === 0) {
      board[r][c] = player;
      const win = checkWin(r, c, player);
      board[r][c] = 0;
      return !!win;
    }
  }
  return false;
}

function getBestMoveMinimax() {
  let bestScore = -Infinity;
  let bestCol = 3;
  const colOrder = [3, 2, 4, 1, 5, 0, 6];

  // 1. Immediate Win
  for (const c of colOrder) {
    if (canPlace(c) && willWin(c, 2)) return c;
  }
  // 2. Immediate Block
  for (const c of colOrder) {
    if (canPlace(c) && willWin(c, 1)) return c;
  }

  // 3. Score-based lookahead
  for (const c of colOrder) {
    if (!canPlace(c)) continue;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] === 0) {
        board[r][c] = 2;
        const score = evaluateBoard();
        board[r][c] = 0;

        if (score > bestScore) {
          bestScore = score;
          bestCol = c;
        }
        break;
      }
    }
  }
  return bestCol;
}

function evaluateBoard() {
  let score = 0;
  // Prefer center columns
  for (let r = 0; r < ROWS; r++) {
    if (board[r][3] === 2) score += 4;
    if (board[r][2] === 2 || board[r][4] === 2) score += 2;
  }
  return score;
}

// Initial setup
initBoard();
renderSelectors();
renderBoard();
</script>
</body>
</html>
