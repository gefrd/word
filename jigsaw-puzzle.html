<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jigsaw Art</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-glow: #60a5fa;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, #1e293b 0%, transparent 70%);
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            z-index: 10;
            opacity: 1;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(10px);
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.5));
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #f8fafc;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        button {
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }
        
        button.secondary {
            background: rgba(51, 65, 85, 0.8);
            box-shadow: none;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .settings-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .settings-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .grid-btn {
            background: #334155;
            color: #cbd5e1;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 1rem;
            text-align: center;
            transition: all 0.2s;
        }

        .grid-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent);
            color: white;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: calc(10px + var(--safe-top)) 15px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px calc(15px + var(--safe-bottom));
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 5;
            pointer-events: none;
        }

        .control-btn {
            pointer-events: auto;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        
        .control-btn:active {
            transform: scale(0.9);
            background: rgba(59, 130, 246, 0.8);
        }

        .control-btn.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: var(--accent-glow);
        }

        #previewImage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 60%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border: 2px solid rgba(255,255,255,0.2);
        }

        #previewImage.show {
            opacity: 1;
        }

        #stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #cbd5e1;
        }
        
        #art-select {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 5px 0;
            width: 100%;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        #art-select::-webkit-scrollbar {
            display: none;
        }
        
        .art-thumb {
            min-width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #333;
            border: 2px solid transparent;
            scroll-snap-align: start;
        }
        
        .art-thumb.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="previewContainer">
        <canvas id="previewImage"></canvas>
    </div>

    <div id="hud" style="display: none;">
        <div class="hud-panel" id="timerDisplay">00:00</div>
        <div class="hud-panel" id="progressDisplay">0%</div>
    </div>

    <div id="bottom-controls" style="display: none;">
        <div class="control-btn" id="btn-preview">👁️</div>
        <div class="control-btn" id="btn-bg">🖼️</div>
        <div class="control-btn" id="btn-edges">🧩</div>
        <div class="control-btn" id="btn-menu">⚙️</div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1>Jigsaw Art</h1>
        <div class="card">
            
            <div class="settings-group">
                <div class="settings-label">Select Art</div>
                <div id="art-select">
                    <!-- populated by JS -->
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-label">Difficulty</div>
                <div class="grid-select">
                    <div class="grid-btn" data-diff="3">Easy (3x3)</div>
                    <div class="grid-btn active" data-diff="4">Medium (4x4)</div>
                    <div class="grid-btn" data-diff="5">Hard (5x5)</div>
                    <div class="grid-btn" data-diff="6">Expert (6x6)</div>
                </div>
            </div>

            <button id="startBtn">Play Now</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen hidden">
        <h1>Masterpiece!</h1>
        <div class="card">
            <h2>Puzzle Complete</h2>
            <div id="stats">
                <div>Time: <span id="finalTime" style="color:white;font-weight:bold;">00:00</span></div>
            </div>
            <div style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px;">
                Best Time: <span id="bestTime">--:--</span>
            </div>
            <button id="restartBtn">Play Again</button>
            <button id="menuBtn" class="secondary">Main Menu</button>
        </div>
    </div>

<script>
/** Audio System */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const Sound = {
    playTone: (freq, type, duration, vol=0.1) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    },
    pickup: () => {
        Sound.playTone(300, 'sine', 0.1, 0.05);
        Sound.playTone(400, 'sine', 0.15, 0.05);
    },
    snap: () => {
        Sound.playTone(150, 'triangle', 0.1, 0.2);
        Sound.playTone(200, 'square', 0.15, 0.1);
        if (navigator.vibrate) navigator.vibrate(15);
    },
    complete: () => {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            setTimeout(() => {
                Sound.playTone(freq, 'sine', 0.5, 0.1);
            }, i * 150);
        });
        if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 50]);
    }
};

/** Procedural Art Generators */
const ArtGen = {
    sunset: (ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a0b2e');
        grad.addColorStop(0.4, '#cb2d3e');
        grad.addColorStop(0.7, '#ef473a');
        grad.addColorStop(1, '#ffb88c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Sun
        ctx.fillStyle = 'rgba(255, 200, 100, 0.9)';
        ctx.beginPath();
        ctx.arc(w/2, h*0.6, w*0.15, 0, Math.PI*2);
        ctx.fill();

        // Mountains
        ctx.fillStyle = '#0f0c29';
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0, h*0.7);
        ctx.lineTo(w*0.3, h*0.5);
        ctx.lineTo(w*0.7, h*0.8);
        ctx.lineTo(w, h*0.6);
        ctx.lineTo(w, h);
        ctx.fill();

        ctx.fillStyle = '#1f1c39';
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(w*0.2, h*0.8);
        ctx.lineTo(w*0.5, h*0.6);
        ctx.lineTo(w*0.9, h*0.9);
        ctx.lineTo(w, h);
        ctx.fill();
    },
    kaleidoscope: (ctx, w, h) => {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.translate(w/2, h/2);
        for(let i=0; i<12; i++){
            ctx.rotate(Math.PI/6);
            const grad = ctx.createLinearGradient(0, 0, w/2, 0);
            grad.addColorStop(0, `hsl(${i*30}, 100%, 50%)`);
            grad.addColorStop(1, `hsl(${i*30 + 60}, 100%, 50%)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(w/2, w/4);
            ctx.lineTo(w/2, -w/4);
            ctx.fill();
        }
        ctx.resetTransform();
    },
    nebula: (ctx, w, h) => {
        ctx.fillStyle = '#020024';
        ctx.fillRect(0, 0, w, h);
        
        for(let i=0; i<5; i++){
            const cx = Math.random()*w;
            const cy = Math.random()*h;
            const r = w*0.3 + Math.random()*w*0.3;
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            const hue = Math.random()*100 + 200;
            grad.addColorStop(0, `hsla(${hue}, 80%, 60%, 0.4)`);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.fill();
        }
        
        ctx.fillStyle = 'white';
        for(let i=0; i<200; i++){
            ctx.globalAlpha = Math.random();
            ctx.beginPath();
            ctx.arc(Math.random()*w, Math.random()*h, Math.random()*1.5, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    },
    mandala: (ctx, w, h) => {
        ctx.fillStyle = '#1e3c72';
        ctx.fillRect(0, 0, w, h);
        ctx.translate(w/2, h/2);
        
        for(let r=w*0.4; r>w*0.05; r-=w*0.05) {
            ctx.fillStyle = `hsl(${r}, 70%, 60%)`;
            ctx.beginPath();
            for(let i=0; i<16; i++) {
                const angle = i * Math.PI/8;
                const rOffset = (i%2==0) ? r : r*0.8;
                ctx.lineTo(Math.cos(angle)*rOffset, Math.sin(angle)*rOffset);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        ctx.resetTransform();
    },
    neonGrid: (ctx, w, h) => {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);
        
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#0f0';
        ctx.shadowBlur = 10;
        
        const space = w/10;
        ctx.beginPath();
        for(let x=0; x<=w; x+=space) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
        for(let y=0; y<=h; y+=space) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
        ctx.stroke();
        
        ctx.fillStyle = '#f0f';
        ctx.shadowColor = '#f0f';
        ctx.beginPath();
        ctx.arc(w/2, h/2, w/4, 0, Math.PI*2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
    },
    colorWaves: (ctx, w, h) => {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        for(let i=0; i<h; i+=h/20) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            for(let x=0; x<=w; x+=10) {
                const y = i + Math.sin(x*0.02 + i)*30;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.fillStyle = `hsl(${i/h*360}, 80%, 60%)`;
            ctx.fill();
        }
    },
    abstract: (ctx, w, h) => {
        ctx.fillStyle = '#f4e1d2';
        ctx.fillRect(0, 0, w, h);
        for(let i=0; i<15; i++) {
            ctx.fillStyle = `hsla(${Math.random()*360}, 70%, 60%, 0.8)`;
            ctx.beginPath();
            const type = Math.random();
            const cx = Math.random()*w, cy = Math.random()*h, s = Math.random()*w*0.3;
            if(type < 0.33) {
                ctx.arc(cx, cy, s, 0, Math.PI*2);
            } else if (type < 0.66) {
                ctx.rect(cx, cy, s, s*1.5);
            } else {
                ctx.moveTo(cx, cy - s);
                ctx.lineTo(cx + s, cy + s);
                ctx.lineTo(cx - s, cy + s);
            }
            ctx.fill();
        }
    },
    radialBurst: (ctx, w, h) => {
        ctx.translate(w/2, h/2);
        for(let i=0; i<360; i+=10) {
            ctx.rotate(10 * Math.PI/180);
            ctx.fillStyle = `hsl(${i}, 100%, 50%)`;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(w, 20);
            ctx.lineTo(w, -20);
            ctx.fill();
        }
        ctx.resetTransform();
    }
};

const ART_KEYS = Object.keys(ArtGen);
let selectedArtIndex = 0;

/** Game State */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
let pieces = [];
let pieceSize;
let gridRows, gridCols;
let scale = 1;
let panX = 0, panY = 0;
let isDragging = false, draggedPiece = null;
let lastTouch = {x: 0, y: 0};
let initialPinchDist = null;
let initialScale = 1;
let puzzleImageCanvas, puzzleImageCtx;
let showBg = true;
let showOnlyEdges = false;
let startTime, timerInterval;
let connectedGroups = [];
let gameActive = false;

let diffConfig = 4;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    if(gameActive) draw();
}
window.addEventListener('resize', resize);
resize();

function generatePuzzleImage() {
    puzzleImageCanvas = document.createElement('canvas');
    const size = Math.min(W, H) * 0.9;
    
    // determine nice aspect ratio based on screen
    let imgW = size;
    let imgH = size;
    if (W > H) imgW = size * 1.5;
    else imgH = size * 1.5;

    puzzleImageCanvas.width = imgW;
    puzzleImageCanvas.height = imgH;
    puzzleImageCtx = puzzleImageCanvas.getContext('2d');
    
    ArtGen[ART_KEYS[selectedArtIndex]](puzzleImageCtx, imgW, imgH);
    
    // setup preview
    const pCanvas = document.getElementById('previewImage');
    pCanvas.width = imgW;
    pCanvas.height = imgH;
    const pCtx = pCanvas.getContext('2d');
    pCtx.drawImage(puzzleImageCanvas, 0, 0);

    return {w: imgW, h: imgH};
}

function initGame() {
    pieces = [];
    connectedGroups = [];
    gridCols = diffConfig;
    gridRows = diffConfig;
    
    const imgSize = generatePuzzleImage();
    pieceSize = Math.min(imgSize.w / gridCols, imgSize.h / gridRows);
    
    // adjust canvas to match exactly grid
    imgSize.w = pieceSize * gridCols;
    imgSize.h = pieceSize * gridRows;
    
    // Setup edges
    const edges = [];
    for(let r=0; r<=gridRows; r++) {
        edges[r] = [];
        for(let c=0; c<=gridCols; c++) {
            edges[r][c] = {
                right: (c < gridCols) ? (Math.random() > 0.5 ? 1 : -1) : 0,
                bottom: (r < gridRows) ? (Math.random() > 0.5 ? 1 : -1) : 0
            };
        }
    }

    for(let r=0; r<gridRows; r++) {
        for(let c=0; c<gridCols; c++) {
            const piece = {
                id: r*gridCols + c,
                r, c,
                x: Math.random() * (W - pieceSize),
                y: Math.random() * (H - pieceSize),
                targetX: c * pieceSize,
                targetY: r * pieceSize,
                top: r===0 ? 0 : -edges[r-1][c].bottom,
                right: edges[r][c].right,
                bottom: edges[r][c].bottom,
                left: c===0 ? 0 : -edges[r][c-1].right,
                isEdge: r===0 || c===0 || r===gridRows-1 || c===gridCols-1,
                group: null,
                path: new Path2D()
            };
            
            piece.group = { id: piece.id, pieces: [piece] };
            connectedGroups.push(piece.group);
            
            buildPiecePath(piece);
            pieces.push(piece);
        }
    }
    
    // center and scale initial view
    panX = W/2 - imgSize.w/2;
    panY = H/2 - imgSize.h/2;
    scale = 1;
    
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
    updateProgress();
    
    gameActive = true;
    draw();
}

function buildPiecePath(p) {
    const s = pieceSize;
    const tabSize = s * 0.2;
    const pth = new Path2D();
    
    pth.moveTo(0, 0);
    
    // Top
    if (p.top === 0) pth.lineTo(s, 0);
    else {
        pth.lineTo(s*0.35, 0);
        pth.bezierCurveTo(s*0.35, p.top*tabSize*2, s*0.65, p.top*tabSize*2, s*0.65, 0);
        pth.lineTo(s, 0);
    }
    // Right
    if (p.right === 0) pth.lineTo(s, s);
    else {
        pth.lineTo(s, s*0.35);
        pth.bezierCurveTo(s - p.right*tabSize*2, s*0.35, s - p.right*tabSize*2, s*0.65, s, s*0.65);
        pth.lineTo(s, s);
    }
    // Bottom
    if (p.bottom === 0) pth.lineTo(0, s);
    else {
        pth.lineTo(s*0.65, s);
        pth.bezierCurveTo(s*0.65, s - p.bottom*tabSize*2, s*0.35, s - p.bottom*tabSize*2, s*0.35, s);
        pth.lineTo(0, s);
    }
    // Left
    if (p.left === 0) pth.lineTo(0, 0);
    else {
        pth.lineTo(0, s*0.65);
        pth.bezierCurveTo(p.left*tabSize*2, s*0.65, p.left*tabSize*2, s*0.35, 0, s*0.35);
        pth.lineTo(0, 0);
    }
    p.path = pth;
}

function getPointerPos(e) {
    if(e.touches) {
        return {x: e.touches[0].clientX, y: e.touches[0].clientY};
    }
    return {x: e.clientX, y: e.clientY};
}

function screenToWorld(x, y) {
    return {
        x: (x - panX) / scale,
        y: (y - panY) / scale
    };
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('mouseout', (e) => { if(e.relatedTarget === null) onPointerUp(e); });

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if(e.touches.length === 2) {
        // start pinch
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.sqrt(dx*dx + dy*dy);
        initialScale = scale;
        draggedPiece = null;
    } else if (e.touches.length === 1) {
        onPointerDown(e);
    }
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if(e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        scale = initialScale * (dist / initialPinchDist);
        scale = Math.max(0.2, Math.min(scale, 3));
        draw();
    } else if(e.touches.length === 1) {
        onPointerMove(e);
    }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    initialPinchDist = null;
    if(e.touches.length === 0) onPointerUp(e);
}, {passive: false});

function onPointerDown(e) {
    if(!gameActive) return;
    const pos = getPointerPos(e);
    const wPos = screenToWorld(pos.x, pos.y);
    lastTouch = pos;
    
    // Find piece (reverse order for z-index)
    for(let i=pieces.length-1; i>=0; i--) {
        const p = pieces[i];
        if(showOnlyEdges && !p.isEdge) continue;
        
        ctx.save();
        ctx.translate(p.x, p.y);
        if(ctx.isPointInPath(p.path, wPos.x, wPos.y)) {
            draggedPiece = p;
            Sound.pickup();
            
            // Bring group to front
            p.group.pieces.forEach(gp => {
                pieces.splice(pieces.indexOf(gp), 1);
                pieces.push(gp);
            });
            ctx.restore();
            draw();
            return;
        }
        ctx.restore();
    }
    isDragging = true;
}

function onPointerMove(e) {
    if(!gameActive) return;
    const pos = getPointerPos(e);
    const dx = pos.x - lastTouch.x;
    const dy = pos.y - lastTouch.y;
    lastTouch = pos;

    if(draggedPiece) {
        draggedPiece.group.pieces.forEach(p => {
            p.x += dx / scale;
            p.y += dy / scale;
        });
        draw();
    } else if(isDragging) {
        panX += dx;
        panY += dy;
        draw();
    }
}

function onPointerUp(e) {
    isDragging = false;
    if(draggedPiece) {
        checkSnap(draggedPiece.group);
        draggedPiece = null;
        draw();
    }
}

function checkSnap(group) {
    const snapDist = pieceSize * 0.25;
    let snapped = false;

    // We check if any piece in the dragging group is close enough to any piece outside the group
    for(let p1 of group.pieces) {
        for(let p2 of pieces) {
            if(p1.group === p2.group) continue;
            
            // Expected relative position
            const expDx = p1.targetX - p2.targetX;
            const expDy = p1.targetY - p2.targetY;
            
            // Actual relative position
            const actDx = p1.x - p2.x;
            const actDy = p1.y - p2.y;
            
            const dist = Math.sqrt(Math.pow(expDx - actDx, 2) + Math.pow(expDy - actDy, 2));
            
            if(dist < snapDist) {
                // Snap!
                const offsetX = p2.x + expDx - p1.x;
                const offsetY = p2.y + expDy - p1.y;
                
                // Merge groups
                const oldGroup = group;
                const newGroup = p2.group;
                
                oldGroup.pieces.forEach(p => {
                    p.x += offsetX;
                    p.y += offsetY;
                    p.group = newGroup;
                    newGroup.pieces.push(p);
                });
                
                connectedGroups = connectedGroups.filter(g => g !== oldGroup);
                snapped = true;
                Sound.snap();
                
                // break out to prevent multiple snapping offsets
                break;
            }
        }
        if(snapped) break;
    }
    
    updateProgress();
}

function updateProgress() {
    const total = pieces.length;
    let maxGroup = 0;
    connectedGroups.forEach(g => {
        if(g.pieces.length > maxGroup) maxGroup = g.pieces.length;
    });
    
    const pct = Math.floor((maxGroup / total) * 100);
    document.getElementById('progressDisplay').innerText = pct + '%';
    
    if(pct === 100) {
        gameComplete();
    }
}

function updateTimer() {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(scale, scale);

    // Draw reference image
    if(showBg && puzzleImageCanvas) {
        ctx.globalAlpha = 0.15;
        ctx.drawImage(puzzleImageCanvas, 0, 0);
        ctx.globalAlpha = 1;
    }

    // Draw pieces
    pieces.forEach(p => {
        if(showOnlyEdges && !p.isEdge) return;
        
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // clipping mask for image
        ctx.beginPath();
        ctx.addPath(p.path);
        ctx.clip();
        
        ctx.drawImage(
            puzzleImageCanvas,
            p.targetX, p.targetY, pieceSize, pieceSize,
            0, 0, pieceSize, pieceSize
        );
        
        ctx.restore();
        
        // draw stroke on top
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.strokeStyle = draggedPiece && p.group === draggedPiece.group ? '#60a5fa' : 'rgba(0,0,0,0.5)';
        ctx.lineWidth = draggedPiece && p.group === draggedPiece.group ? 3 : 1;
        ctx.stroke(p.path);
        ctx.restore();
    });

    ctx.restore();
}

function gameComplete() {
    gameActive = false;
    clearInterval(timerInterval);
    Sound.complete();
    
    // snap to center
    const g = pieces[0].group;
    const bounds = {minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity};
    g.pieces.forEach(p => {
        bounds.minX = Math.min(bounds.minX, p.targetX);
        bounds.minY = Math.min(bounds.minY, p.targetY);
        bounds.maxX = Math.max(bounds.maxX, p.targetX + pieceSize);
        bounds.maxY = Math.max(bounds.maxY, p.targetY + pieceSize);
    });
    
    const cx = (bounds.maxX - bounds.minX) / 2;
    const cy = (bounds.maxY - bounds.minY) / 2;
    
    panX = W/2 - cx*scale;
    panY = H/2 - cy*scale;
    
    g.pieces.forEach(p => {
        p.x = p.targetX;
        p.y = p.targetY;
    });
    
    draw();
    
    // Fireworks
    let fw = 0;
    const fwInt = setInterval(() => {
        createFirework(Math.random()*W, Math.random()*H);
        fw++;
        if(fw > 15) clearInterval(fwInt);
    }, 200);

    setTimeout(() => {
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('hud').style.display = 'none';
        document.getElementById('bottom-controls').style.display = 'none';
        
        const finalStr = document.getElementById('timerDisplay').innerText;
        document.getElementById('finalTime').innerText = finalStr;
        
        // local storage score
        const key = `jigsaw_best_${diffConfig}`;
        const prev = localStorage.getItem(key);
        const currSec = Math.floor((Date.now() - startTime) / 1000);
        
        if(!prev || currSec < parseInt(prev)) {
            localStorage.setItem(key, currSec);
            document.getElementById('bestTime').innerText = finalStr + " (New Best!)";
        } else {
            const m = Math.floor(prev / 60).toString().padStart(2, '0');
            const s = (prev % 60).toString().padStart(2, '0');
            document.getElementById('bestTime').innerText = `${m}:${s}`;
        }
        
    }, 3000);
}

function createFirework(x, y) {
    const pCanvas = document.createElement('canvas');
    pCanvas.width = W; pCanvas.height = H;
    pCanvas.style.position = 'absolute';
    pCanvas.style.top = '0'; pCanvas.style.left = '0';
    pCanvas.style.pointerEvents = 'none';
    pCanvas.style.zIndex = '20';
    document.body.appendChild(pCanvas);
    const pctx = pCanvas.getContext('2d');
    
    const particles = [];
    const color = `hsl(${Math.random()*360}, 100%, 50%)`;
    for(let i=0; i<30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle)*speed,
            vy: Math.sin(angle)*speed,
            alpha: 1
        });
    }
    
    function anim() {
        pctx.clearRect(0,0,W,H);
        let alive = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1; // grav
            p.alpha -= 0.02;
            if(p.alpha > 0) {
                alive = true;
                pctx.fillStyle = color;
                pctx.globalAlpha = p.alpha;
                pctx.beginPath();
                pctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                pctx.fill();
            }
        });
        if(alive) requestAnimationFrame(anim);
        else document.body.removeChild(pCanvas);
    }
    anim();
    Sound.playTone(600, 'sine', 0.1, 0.05);
}


/** UI Wiring */
document.querySelectorAll('.grid-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        diffConfig = parseInt(btn.dataset.diff);
    });
});

const artSelect = document.getElementById('art-select');
ART_KEYS.forEach((key, idx) => {
    const thumb = document.createElement('canvas');
    thumb.className = 'art-thumb' + (idx === 0 ? ' active' : '');
    thumb.width = 60; thumb.height = 60;
    const tctx = thumb.getContext('2d');
    ArtGen[key](tctx, 60, 60);
    
    thumb.addEventListener('click', () => {
        document.querySelectorAll('.art-thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
        selectedArtIndex = idx;
    });
    artSelect.appendChild(thumb);
});

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('bottom-controls').style.display = 'flex';
    if(audioCtx.state === 'suspended') audioCtx.resume();
    initGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('bottom-controls').style.display = 'flex';
    initGame();
});

document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
});

// Bottom controls
const btnPreview = document.getElementById('btn-preview');
btnPreview.addEventListener('touchstart', (e) => { e.preventDefault(); document.getElementById('previewImage').classList.add('show'); });
btnPreview.addEventListener('touchend', (e) => { e.preventDefault(); document.getElementById('previewImage').classList.remove('show'); });
btnPreview.addEventListener('mousedown', () => { document.getElementById('previewImage').classList.add('show'); });
window.addEventListener('mouseup', () => { document.getElementById('previewImage').classList.remove('show'); });

const btnBg = document.getElementById('btn-bg');
btnBg.classList.add('active');
btnBg.addEventListener('click', () => {
    showBg = !showBg;
    btnBg.classList.toggle('active', showBg);
    draw();
});

const btnEdges = document.getElementById('btn-edges');
btnEdges.addEventListener('click', () => {
    showOnlyEdges = !showOnlyEdges;
    btnEdges.classList.toggle('active', showOnlyEdges);
    draw();
});

document.getElementById('btn-menu').addEventListener('click', () => {
    if(confirm('Return to menu? Current progress will be lost.')) {
        gameActive = false;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('bottom-controls').style.display = 'none';
        document.getElementById('startScreen').classList.remove('hidden');
    }
});

</script>
