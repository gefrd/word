<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minesweeper Classic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 12px 8px;
    touch-action: manipulation;
  }
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 480px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }
  .btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn.active, .btn:active {
    background: #3b82f6;
    color: #fff;
    border-color: #60a5fa;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
  }
  .game-box {
    background: #1e293b;
    border-radius: 14px;
    padding: 10px;
    border: 2px solid #334155;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: #0f172a;
    padding: 8px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #334155;
  }
  .lcd {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 900;
    color: #ef4444;
    background: #000;
    padding: 4px 8px;
    border-radius: 6px;
    letter-spacing: 2px;
    min-width: 58px;
    text-align: center;
    border: 1px solid #450a0a;
  }
  .face-btn {
    font-size: 26px;
    background: #334155;
    border: 2px solid #475569;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .face-btn:active { transform: scale(0.9); }
  .board-container {
    overflow: auto;
    max-width: 100vw;
    max-height: 65vh;
    padding: 4px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #1e293b;
  }
  .grid {
    display: grid;
    gap: 2px;
    background: #334155;
    padding: 2px;
    border-radius: 6px;
  }
  .cell {
    width: 32px;
    height: 32px;
    background: #1e293b;
    border: 2px outset #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    border-radius: 3px;
  }
  .cell.revealed {
    background: #0f172a;
    border: 1px solid #1e293b;
  }
  .cell.mine-hit {
    background: #dc2626 !important;
    animation: shake 0.3s;
  }
  .cell.c1 { color: #38bdf8; }
  .cell.c2 { color: #4ade80; }
  .cell.c3 { color: #f87171; }
  .cell.c4 { color: #a78bfa; }
  .cell.c5 { color: #fbbf24; }
  .cell.c6 { color: #2dd4bf; }
  .cell.c7 { color: #f472b6; }
  .cell.c8 { color: #ffffff; }
  
  .mobile-toggle {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #334155;
    color: #fff;
    border: 1px solid #475569;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn.flag-mode {
    background: #e11d48;
    border-color: #fb7185;
    box-shadow: 0 0 12px rgba(225, 29, 72, 0.5);
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 3px); }
    50% { transform: translate(3px, -3px); }
    75% { transform: translate(-3px, -3px); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">💣 MINESWEEPER</div>
  <div class="controls">
    <button class="btn active" onclick="setDiff(9,9,10,this)">9×9 (10)</button>
    <button class="btn" onclick="setDiff(16,16,40,this)">16×16 (40)</button>
    <button class="btn" onclick="setDiff(16,30,99,this)">Expert (99)</button>
  </div>
</div>

<div class="game-box">
  <div class="status-bar">
    <div class="lcd" id="mine-count">010</div>
    <div class="face-btn" id="face" onclick="initGame()">🙂</div>
    <div class="lcd" id="timer">000</div>
  </div>

  <div class="board-container">
    <div class="grid" id="grid"></div>
  </div>

  <div class="mobile-toggle">
    <button class="toggle-btn" id="mode-btn" onclick="toggleMode()">
      <span id="mode-icon">⛏️</span> <span id="mode-text">Mode: Reveal</span>
    </button>
  </div>
</div>

<script>
let audioCtx = null;
function playFx(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if (type === 'click') {
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'flag') {
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'boom') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      osc.frequency.setValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e){}
}

let rows = 9, cols = 9, totalMines = 10;
let grid = [], revealedCount = 0, flagsCount = 0;
let gameOver = false, gameStarted = false;
let timer = 0, timerInterval = null;
let flagMode = false;
let longPressHandled = false;

function toggleMode() {
  flagMode = !flagMode;
  const btn = document.getElementById('mode-btn');
  const icon = document.getElementById('mode-icon');
  const text = document.getElementById('mode-text');
  if (flagMode) {
    btn.classList.add('flag-mode');
    icon.textContent = '🚩';
    text.textContent = 'Mode: Flag';
  } else {
    btn.classList.remove('flag-mode');
    icon.textContent = '⛏️';
    text.textContent = 'Mode: Reveal';
  }
}

function setDiff(r, c, m, btnEl) {
  rows = r; cols = c; totalMines = m;
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  initGame();
}

function initGame() {
  clearInterval(timerInterval);
  timer = 0;
  gameStarted = false;
  gameOver = false;
  revealedCount = 0;
  flagsCount = 0;
  document.getElementById('timer').textContent = '000';
  document.getElementById('mine-count').textContent = String(totalMines).padStart(3, '0');
  document.getElementById('face').textContent = '🙂';

  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
  gridEl.innerHTML = '';
  grid = [];

  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const cell = {
        r, c,
        mine: false,
        revealed: false,
        flagged: false,
        count: 0,
        el: document.createElement('div')
      };
      cell.el.className = 'cell';
      
      let pressTimer = null;
      let isLongPress = false;
      let startX = 0, startY = 0;

      cell.el.addEventListener('pointerdown', (e) => {
        longPressHandled = false;
      }, { passive: true });

      cell.el.addEventListener('touchstart', (e) => {
        isLongPress = false;
        longPressHandled = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        pressTimer = setTimeout(() => {
          isLongPress = true;
          longPressHandled = true;
          handleCellRightClick(r, c);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 350);
      }, { passive: true });

      cell.el.addEventListener('touchmove', (e) => {
        if (!pressTimer) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      }, { passive: true });

      cell.el.addEventListener('touchcancel', (e) => {
        clearTimeout(pressTimer);
        pressTimer = null;
      }, { passive: true });

      cell.el.addEventListener('touchend', (e) => {
        clearTimeout(pressTimer);
        pressTimer = null;
      }, { passive: true });

      cell.el.addEventListener('pointerleave', (e) => {
        clearTimeout(pressTimer);
        pressTimer = null;
      }, { passive: true });

      cell.el.addEventListener('pointercancel', (e) => {
        clearTimeout(pressTimer);
        pressTimer = null;
      }, { passive: true });

      cell.el.addEventListener('click', (e) => {
        if (isLongPress) return;
        if (flagMode) {
          handleCellRightClick(r, c);
        } else {
          handleCellClick(r, c);
        }
      });

      cell.el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (longPressHandled) return;
        handleCellRightClick(r, c);
      });

      gridEl.appendChild(cell.el);
      grid[r][c] = cell;
    }
  }
}

function placeMines(firstR, firstC) {
  let placed = 0;
  while (placed < totalMines) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (!grid[r][c].mine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
      grid[r][c].mine = true;
      placed++;
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].mine) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].mine) {
            count++;
          }
        }
      }
      grid[r][c].count = count;
    }
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    timer = Math.min(999, timer + 1);
    document.getElementById('timer').textContent = String(timer).padStart(3, '0');
  }, 1000);
}

function handleCellClick(r, c) {
  if (gameOver) return;
  const cell = grid[r][c];
  if (cell.flagged || cell.revealed) return;

  if (!gameStarted) {
    gameStarted = true;
    placeMines(r, c);
    startTimer();
  }

  if (cell.mine) {
    revealMine(cell);
    return;
  }

  playFx('click');
  revealCell(r, c);
  checkWin();
}

function handleCellRightClick(r, c) {
  if (gameOver) return;
  const cell = grid[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  playFx('flag');
  if (cell.flagged) {
    cell.el.textContent = '🚩';
    flagsCount++;
  } else {
    cell.el.textContent = '';
    flagsCount--;
  }
  const remaining = Math.max(-99, totalMines - flagsCount);
  document.getElementById('mine-count').textContent = remaining < 0 ? '-' + String(Math.abs(remaining)).padStart(2, '0') : String(remaining).padStart(3, '0');
}

function revealCell(r, c) {
  const cell = grid[r][c];
  if (cell.revealed || cell.flagged) return;

  cell.revealed = true;
  revealedCount++;
  cell.el.classList.add('revealed');

  if (cell.count > 0) {
    cell.el.textContent = cell.count;
    cell.el.classList.add('c' + cell.count);
  } else {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          revealCell(nr, nc);
        }
      }
    }
  }
}

function revealMine(hitCell) {
  gameOver = true;
  clearInterval(timerInterval);
  document.getElementById('face').textContent = '😵';
  playFx('boom');
  if (navigator.vibrate) navigator.vibrate([100, 50, 150]);

  hitCell.el.classList.add('mine-hit');
  hitCell.el.textContent = '💥';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      if (cell.mine && cell !== hitCell) {
        cell.el.classList.add('revealed');
        cell.el.textContent = '💣';
      } else if (!cell.mine && cell.flagged) {
        cell.el.textContent = '❌';
      }
    }
  }
}

function checkWin() {
  if (revealedCount === (rows * cols - totalMines)) {
    gameOver = true;
    clearInterval(timerInterval);
    document.getElementById('face').textContent = '😎';
    playFx('win');
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].mine) grid[r][c].el.textContent = '🚩';
      }
    }
    document.getElementById('mine-count').textContent = '000';
  }
}

initGame();
</script>
</body>
</html>
