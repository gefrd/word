<!doctype html><html><body><script type="module">
import { loadPhoto, analyzePhoto, reliefMesh } from '/src/photo3d.js';
window.runPhoto = async (url) => {
  const blob = await (await fetch(url)).blob();
  const photo = await loadPhoto(blob, 1024);
  const t0 = performance.now(); const log = [];
  const ai = await analyzePhoto(photo, { skipDepth: true, workerConfig: { localModelPath: '/test/models/', wasmPaths: '/node_modules/onnxruntime-web/dist/', forceWasm: true } }, (s, p) => log.push(s + ':' + p.toFixed(2)));
  const tAI = performance.now() - t0;
  const m = reliefMesh(photo, ai, { grid: 140, thickness: 0.35 });
  // mask preview
  const c = document.createElement('canvas'); c.width = ai.width; c.height = ai.height; const x = c.getContext('2d'); const id = x.createImageData(ai.width, ai.height);
  for (let i = 0; i < ai.mask.length; i++) { id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = ai.mask[i]; id.data[i*4+3] = 255; } x.putImageData(id, 0, 0);
  return { tAI: Math.round(tAI), device: ai.device, verts: m.positions.length / 3, tris: m.indices.length / 3, size: m.size, mask: c.toDataURL(), log: log.slice(-4),
    mesh: { positions: Array.from(m.positions), indices: Array.from(m.indices), uvs: Array.from(m.uvs), tex: m.textureCanvas.toDataURL('image/jpeg', 0.8) } };
};
window.ready = true;
</script></body></html>
