<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sokoban Neon</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    height: 100dvh;
    padding: 8px 6px;
    touch-action: none;
    overflow: hidden;
  }

  .game-header {
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px;
  }

  .header-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.15s;
  }

  .header-btn:active {
    transform: scale(0.92);
  }

  .game-title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Info bar */
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 420px;
    padding: 6px 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    margin: 4px 0;
  }

  .info-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
  }

  .info-val {
    color: #38bdf8;
    font-size: 16px;
    font-weight: 900;
    font-family: monospace;
  }

  /* Canvas Area */
  .canvas-wrap {
    flex: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  canvas {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  /* Controls Area (D-Pad + Action Buttons) */
  .controls-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    padding: 4px 8px;
    gap: 12px;
  }

  /* D-Pad */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }

  .dbtn {
    background: #1e293b;
    border: 1.5px solid #334155;
    border-radius: 10px;
    color: #38bdf8;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: all 0.1s;
  }

  .dbtn:active {
    background: #0284c7;
    color: #fff;
    transform: scale(0.92);
    border-color: #38bdf8;
  }

  /* Side Action Buttons */
  .side-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .act-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.1s;
  }

  .act-btn:active {
    transform: scale(0.94);
    background: #334155;
  }

  /* Victory Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #0f172a;
    border: 1.5px solid #10b981;
    border-radius: 18px;
    padding: 24px;
    width: 86%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(16, 185, 129, 0.25);
  }

  .modal-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
    color: #10b981;
  }

  .btn-next {
    background: linear-gradient(135deg, #059669, #10b981);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
  }
</style>
</head>
<body>

  <div class="game-header">
    <button class="header-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/arcade.html'" aria-label="Back">
      ←
    </button>
    <div class="game-title">SOKOBAN NEON</div>
    <button class="header-btn" onclick="toggleMute()" id="muteBtn" aria-label="Mute">
      🔊
    </button>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <span>LEVEL:</span>
      <span class="info-val" id="lvlNum">1</span>
    </div>
    <div class="info-item">
      <span>MOVES:</span>
      <span class="info-val" id="moveCount">0</span>
    </div>
    <div class="info-item">
      <span>BOXES:</span>
      <span class="info-val" id="boxCount">0/0</span>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="sokoCanvas"></canvas>
  </div>

  <div class="controls-wrap">
    <div class="dpad">
      <div></div>
      <button class="dbtn" onclick="movePlayer(0, -1)">▲</button>
      <div></div>
      <button class="dbtn" onclick="movePlayer(-1, 0)">◀</button>
      <button class="dbtn" onclick="movePlayer(0, 1)">▼</button>
      <button class="dbtn" onclick="movePlayer(1, 0)">▶</button>
    </div>

    <div class="side-actions">
      <button class="act-btn" onclick="undoMove()">
        <span>↩️</span> Undo
      </button>
      <button class="act-btn" onclick="resetLevel()">
        <span>🔄</span> Reset
      </button>
      <button class="act-btn" onclick="prevLevel()">
        <span>⏮️</span> Prev
      </button>
      <button class="act-btn" onclick="nextLevelBtn()">
        <span>⏭️</span> Next
      </button>
    </div>
  </div>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="vicModal">
    <div class="modal">
      <div style="font-size: 38px; margin-bottom: 6px;">📦✨</div>
      <div class="modal-title">LEVEL COMPLETE!</div>
      <div style="color: #94a3b8; font-size: 14px; margin-bottom: 4px;" id="vicMoves">Solved in 24 moves</div>
      <button class="btn-next" onclick="loadNextLevel()">NEXT LEVEL</button>
    </div>
  </div>

<script>
// --- Web Audio Synthesizer ---
let audioCtx = null;
let isMuted = false;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (isMuted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'step') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    } else if (type === 'push') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'goal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.06);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.08);
      osc.frequency.setValueAtTime(659.25, now + 0.16);
      osc.frequency.setValueAtTime(880, now + 0.24);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    }
  } catch (e) {}
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
}

// --- Sokoban Levels (Classic Curated Microban Collection) ---
// Legend: # = Wall, . = Target, $ = Box, * = Box on Target, @ = Player, + = Player on Target, ' ' = Floor
const LEVELS = [
  // L1
  [
    "  ##### ",
    "###   # ",
    "# $ # ##",
    "# #  . #",
    "#    # #",
    "## #   #",
    " #@$ . #",
    " #######"
  ],
  // L2
  [
    "#####  ",
    "#@  #  ",
    "# $$# ##",
    "# $ #  #",
    "### ### ",
    "  #.#   ",
    "  #..###",
    "  #   .#",
    "  ######"
  ],
  // L3
  [
    "  ####  ",
    "###  ####",
    "#     $ #",
    "# #  #$ #",
    "# . .#@ #",
    "#########"
  ],
  // L4
  [
    "########",
    "#  ..  #",
    "# $$#$ #",
    "# #  # #",
    "#   @#.#",
    "########"
  ],
  // L5
  [
    "  ######",
    "###    #",
    "#   $$ #",
    "# ## # #",
    "# . .@ #",
    "########"
  ],
  // L6
  [
    " #######",
    " #     #",
    " # .$. #",
    "##  $  #",
    "#  $.$ #",
    "#   @###",
    "######  "
  ],
  // L7
  [
    "######  ",
    "#    ###",
    "# #$   #",
    "#  * # #",
    "##$#.# #",
    " # .@  #",
    " #######"
  ],
  // L8
  [
    "  ##### ",
    "###   # ",
    "# .$$ # ",
    "# # .###",
    "#   .#@#",
    "####$  #",
    "   #####"
  ],
  // L9
  [
    "  ######",
    "  #    #",
    "###$$# #",
    "#   .# #",
    "# #. #@#",
    "#   .###",
    "######  "
  ],
  // L10
  [
    "######  ",
    "#    ###",
    "# $#$  #",
    "# . .# #",
    "##$#.# #",
    " #  @# #",
    " #######"
  ]
];

let currentLevelIdx = 0;
let grid = [];
let player = { r: 0, c: 0 };
let moveHistory = [];
let movesCount = 0;
let isLevelWon = false;

const canvas = document.getElementById('sokoCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let cellSize = 36;
let gridRows = 0;
let gridCols = 0;

function loadLevel(idx) {
  currentLevelIdx = (idx + LEVELS.length) % LEVELS.length;
  document.getElementById('lvlNum').textContent = currentLevelIdx + 1;
  document.getElementById('vicModal').classList.remove('show');
  isLevelWon = false;
  movesCount = 0;
  moveHistory = [];
  document.getElementById('moveCount').textContent = '0';

  const raw = LEVELS[currentLevelIdx];
  gridRows = raw.length;
  gridCols = Math.max(...raw.map(r => r.length));

  grid = [];
  for (let r = 0; r < gridRows; r++) {
    grid[r] = [];
    for (let c = 0; c < gridCols; c++) {
      const ch = raw[r][c] || ' ';
      grid[r][c] = ch;
      if (ch === '@' || ch === '+') {
        player.r = r;
        player.c = c;
      }
    }
  }

  resizeCanvas();
  updateBoxCount();
  draw();
}

function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const maxW = rect.width - 16;
  const maxH = rect.height - 16;

  cellSize = Math.floor(Math.min(maxW / gridCols, maxH / gridRows));
  canvas.width = gridCols * cellSize;
  canvas.height = gridRows * cellSize;
}

window.addEventListener('resize', () => {
  resizeCanvas();
  draw();
});

function updateBoxCount() {
  let totalGoals = 0;
  let filledGoals = 0;

  for (let r = 0; r < gridRows; r++) {
    for (let c = 0; c < gridCols; c++) {
      const ch = grid[r][c];
      if (ch === '.' || ch === '*' || ch === '+') totalGoals++;
      if (ch === '*') filledGoals++;
    }
  }
  document.getElementById('boxCount').textContent = `${filledGoals}/${totalGoals}`;
}

function movePlayer(dc, dr) {
  initAudio();
  if (isLevelWon) return;

  const targetR = player.r + dr;
  const targetC = player.c + dc;

  if (targetR < 0 || targetR >= gridRows || targetC < 0 || targetC >= gridCols) return;

  const targetTile = grid[targetR][targetC];
  if (targetTile === '#') return; // Hit wall

  // Is box?
  if (targetTile === '$' || targetTile === '*') {
    const boxDestR = targetR + dr;
    const boxDestC = targetC + dc;

    if (boxDestR < 0 || boxDestR >= gridRows || boxDestC < 0 || boxDestC >= gridCols) return;
    const boxDestTile = grid[boxDestR][boxDestC];

    // Cannot push into wall or another box
    if (boxDestTile === '#' || boxDestTile === '$' || boxDestTile === '*') return;

    // Push box
    saveState();

    // Move Box
    grid[boxDestR][boxDestC] = (boxDestTile === '.' || boxDestTile === '+') ? '*' : '$';
    grid[targetR][targetC] = (targetTile === '*') ? '.' : ' ';

    // Move Player
    const curPlayerTile = grid[player.r][player.c];
    grid[player.r][player.c] = (curPlayerTile === '+') ? '.' : ' ';
    grid[targetR][targetC] = (grid[targetR][targetC] === '.') ? '+' : '@';

    player.r = targetR;
    player.c = targetC;
    movesCount++;
    document.getElementById('moveCount').textContent = movesCount;

    if (grid[boxDestR][boxDestC] === '*') {
      playSound('goal');
    } else {
      playSound('push');
    }

    updateBoxCount();
    draw();
    checkVictory();
    return;
  }

  // Normal Walk
  saveState();
  const curPlayerTile = grid[player.r][player.c];
  grid[player.r][player.c] = (curPlayerTile === '+') ? '.' : ' ';
  grid[targetR][targetC] = (targetTile === '.') ? '+' : '@';

  player.r = targetR;
  player.c = targetC;
  movesCount++;
  document.getElementById('moveCount').textContent = movesCount;

  playSound('step');
  draw();
}

function saveState() {
  const clone = grid.map(row => [...row]);
  moveHistory.push({ grid: clone, player: { ...player }, moves: movesCount });
}

function undoMove() {
  if (moveHistory.length === 0 || isLevelWon) return;
  const last = moveHistory.pop();
  grid = last.grid;
  player = { ...last.player };
  movesCount = last.moves;
  document.getElementById('moveCount').textContent = movesCount;
  updateBoxCount();
  draw();
}

function resetLevel() {
  loadLevel(currentLevelIdx);
}

function prevLevel() {
  loadLevel(currentLevelIdx - 1);
}

function nextLevelBtn() {
  loadLevel(currentLevelIdx + 1);
}

function loadNextLevel() {
  loadLevel(currentLevelIdx + 1);
}

function checkVictory() {
  let allPlaced = true;
  for (let r = 0; r < gridRows; r++) {
    for (let c = 0; c < gridCols; c++) {
      if (grid[r][c] === '$') {
        allPlaced = false;
        break;
      }
    }
  }

  if (allPlaced) {
    isLevelWon = true;
    playSound('win');
    document.getElementById('vicMoves').textContent = `Solved in ${movesCount} moves!`;
    setTimeout(() => {
      document.getElementById('vicModal').classList.add('show');
    }, 300);
  }
}

// Touch swipe support on Canvas
let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const minSwipe = 24;

  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
    movePlayer(dx > 0 ? 1 : -1, 0);
  } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > minSwipe) {
    movePlayer(0, dy > 0 ? 1 : -1);
  }
  e.preventDefault();
}, { passive: false });

// Keyboard Controls
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) movePlayer(0, -1);
  else if (['ArrowDown', 'KeyS'].includes(e.code)) movePlayer(0, 1);
  else if (['ArrowLeft', 'KeyA'].includes(e.code)) movePlayer(-1, 0);
  else if (['ArrowRight', 'KeyD'].includes(e.code)) movePlayer(1, 0);
  else if (e.code === 'KeyZ') undoMove();
  else if (e.code === 'KeyR') resetLevel();
});

// Render
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < gridRows; r++) {
    for (let c = 0; c < gridCols; c++) {
      const ch = grid[r][c];
      const x = c * cellSize;
      const y = r * cellSize;

      // Floor
      if (ch !== ' ') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x, y, cellSize, cellSize);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, cellSize, cellSize);
      }

      // Wall
      if (ch === '#') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
      }

      // Target Spot
      if (ch === '.' || ch === '+' || ch === '*') {
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Box
      if (ch === '$' || ch === '*') {
        const isGoal = ch === '*';
        ctx.save();
        ctx.shadowColor = isGoal ? '#10b981' : '#f59e0b';
        ctx.shadowBlur = isGoal ? 12 : 6;

        ctx.fillStyle = isGoal ? '#059669' : '#d97706';
        ctx.fillRect(x + 4, y + 4, cellSize - 8, cellSize - 8);

        ctx.strokeStyle = isGoal ? '#34d399' : '#fbbf24';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 4, y + 4, cellSize - 8, cellSize - 8);

        // Box cross
        ctx.beginPath();
        ctx.moveTo(x + 7, y + 7);
        ctx.lineTo(x + cellSize - 7, y + cellSize - 7);
        ctx.moveTo(x + cellSize - 7, y + 7);
        ctx.lineTo(x + 7, y + cellSize - 7);
        ctx.strokeStyle = isGoal ? '#6ee7b7' : '#fef08a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      // Player
      if (ch === '@' || ch === '+') {
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;

        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + cellSize / 2 - 3, y + cellSize / 2 - 2, 2.5, 0, Math.PI * 2);
        ctx.arc(x + cellSize / 2 + 3, y + cellSize / 2 - 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }
  }
}

loadLevel(0);
</script>
</body>
</html>
