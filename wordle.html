<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wordle Neon</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    height: 100dvh;
    padding: 8px 6px;
    touch-action: manipulation;
    overflow: hidden;
  }

  .game-header {
    width: 100%;
    max-width: 440px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px;
    margin-bottom: 6px;
  }

  .header-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.15s;
  }

  .header-btn:active {
    transform: scale(0.92);
  }

  .game-title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #10b981, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    top: 65px;
    background: rgba(244, 63, 94, 0.95);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Grid Board */
  .board-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    max-width: 340px;
    max-height: 380px;
  }

  .grid {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    width: 100%;
    height: 100%;
    aspect-ratio: 5 / 6;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .tile {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    transition: transform 0.2s, background-color 0.4s, border-color 0.4s;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .tile.pop {
    animation: popKey 0.1s ease-in-out;
    border-color: #64748b;
  }

  @keyframes popKey {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .tile.correct {
    background: #059669;
    border-color: #10b981;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
  }

  .tile.present {
    background: #d97706;
    border-color: #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
  }

  .tile.absent {
    background: #1e293b;
    border-color: #1e293b;
    color: #64748b;
  }

  .tile.flip {
    animation: flipTile 0.5s ease-in-out forwards;
  }

  @keyframes flipTile {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }

  /* Keyboard */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 440px;
    margin-bottom: 4px;
  }

  .kb-row {
    display: flex;
    gap: 4px;
    justify-content: center;
    width: 100%;
  }

  .key {
    flex: 1;
    min-width: 28px;
    height: 46px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #f8fafc;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    text-transform: uppercase;
  }

  .key.wide {
    flex: 1.5;
    font-size: 12px;
  }

  .key:active {
    transform: scale(0.92);
    background: #334155;
  }

  .key.correct {
    background: #059669;
    border-color: #10b981;
  }
  .key.present {
    background: #d97706;
    border-color: #f59e0b;
  }
  .key.absent {
    background: #0f172a;
    border-color: #1e293b;
    color: #475569;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #0f172a;
    border: 1.5px solid #38bdf8;
    border-radius: 18px;
    padding: 24px;
    width: 88%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(56, 189, 248, 0.2);
  }

  .modal-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 16px 0;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-num {
    font-size: 20px;
    font-weight: 900;
    color: #38bdf8;
    font-family: monospace;
  }

  .stat-lbl {
    font-size: 9px;
    color: #94a3b8;
    text-transform: uppercase;
  }

  .modal-word {
    font-size: 16px;
    font-weight: 800;
    color: #fbbf24;
    margin-bottom: 16px;
  }

  .btn-next {
    background: linear-gradient(135deg, #059669, #10b981);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
  }
</style>
</head>
<body>

  <div class="game-header">
    <button class="header-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/arcade.html'" aria-label="Back">
      ←
    </button>
    <div class="game-title">WORDLE NEON</div>
    <button class="header-btn" onclick="toggleMute()" id="muteBtn" aria-label="Mute">
      🔊
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="board-container">
    <div class="grid" id="grid"></div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <!-- End Modal -->
  <div class="modal-overlay" id="endModal">
    <div class="modal">
      <div id="modalIcon" style="font-size: 36px; margin-bottom: 6px;">🎉</div>
      <div class="modal-title" id="modalTitle">AWESOME!</div>
      <div class="modal-word" id="modalAnswer">The word was: BRAVE</div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-num" id="stPlayed">0</span>
          <span class="stat-lbl">Played</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="stWinRate">0%</span>
          <span class="stat-lbl">Win %</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="stStreak">0</span>
          <span class="stat-lbl">Streak</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="stBest">0</span>
          <span class="stat-lbl">Max</span>
        </div>
      </div>

      <button class="btn-next" onclick="nextGame()">NEXT WORD</button>
    </div>
  </div>

<script>
// --- Web Audio Synthesizer ---
let audioCtx = null;
let isMuted = false;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (isMuted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'key') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'flip') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'win') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      osc.frequency.setValueAtTime(1046.50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'loss') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  } catch (e) {}
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
}

// Word List (Curated Popular 5-Letter English Words)
const WORDS = [
  "ABOUT","ABOVE","ACTOR","ACUTE","ADMIT","ADOPT","ADULT","AFTER","AGAIN","AGENT",
  "AGREE","AHEAD","ALARM","ALBUM","ALERT","ALIKE","ALIVE","ALLOW","ALONE","ALONG",
  "ALTER","AMONG","ANGEL","ANGER","ANGLE","ANGRY","APART","APPLE","APPLY","ARENA",
  "ARGUE","ARISE","ARRAY","ASIDE","ASSET","AUDIO","AUDIT","AVOID","AWARD","AWARE",
  "BADLY","BAKER","BASES","BASIC","BASIS","BEACH","BEGAN","BEGIN","BEGUN","BEING",
  "BELOW","BENCH","BILLY","BIRTH","BLACK","BLAME","BLIND","BLOCK","BLOOD","BOARD",
  "BOOST","BOOTH","BOUND","BRAIN","BRAND","BREAD","BREAK","BREED","BRIEF","BRING",
  "BROAD","BROKE","BROWN","BUILD","BUILT","BUYER","CABLE","CALIF","CARRY","CATCH",

  "CRIME","CROSS","CROWD","CROWN","CURVE","CYCLE","DAILY","DANCE","DATED","DEALT",
  "DEATH","DEBUT","DELAY","DEPTH","DOING","DOUBT","DOZEN","DRAFT","DRAMA","DRAWN",
  "DREAM","DRESS","DRILL","DRINK","DRIVE","DROVE","DYING","EAGER","EARLY","EARTH",
  "EIGHT","ELITE","EMPTY","ENEMY","ENJOY","ENTER","ENTRY","EQUAL","ERROR","EVENT",

  "GRASS","GREAT","GREEN","GROSS","GROUP","GROWN","GUARD","GUESS","GUEST","GUIDE",
  "HAPPY","HARRY","HEART","HEAVY","HENCE","HORSE","HOTEL","HOUSE","HUMAN","IDEAL",

  "SOUTH","SPACE","SPARE","SPEAK","SPEED","SPEND","SPENT","SPLIT","SPOKE","SPORT",
  "STAFF","STAGE","STAKE","STAND","START","STATE","STEAM","STEEL","STICK","STILL",
  "STOCK","STONE","STOOD","STORE","STORM","STORY","STRIP","STUCK","STUDY","STUFF",
  "STYLE","SUGAR","SUITE","SUPER","SWEET","TABLE","TAKEN","TASTE","TAXES","TEACH",
  "TEETH","TERRY","TEXAS","THANK","THEFT","THEIR","THEME","THERE","THESE","THICK",
  "THING","THINK","THIRD","THOSE","THREE","THREW","THROW","TIGHT","TIMES","TIRED",
  "TITLE","TODAY","TOPIC","TOTAL","TOUCH","TOUGH","TOWER","TRACK","TRADE","TRAIN",
  "TREAT","TREND","TRIAL","TRIED","TRIES","TRUCK","TRULY","TRUST","TRUTH","TWICE",
  "UNDER","UNDUE","UNION","UNITY","UNTIL","UPPER","UPSET","URBAN","USAGE","USUAL",
  "VALID","VALUE","VIDEO","VIRUS","VISIT","VITAL","VOICE","WASTE","WATCH","WATER",
  "WHEEL","WHERE","WHICH","WHILE","WHITE","WHOLE","WHOSE","WOMAN","WOMEN","WORLD",
  "WORRY","WORSE","WORST","WORTH","WOULD","WOUND","WRITE","WRONG","WROTE","YOUTH"
];

let targetWord = '';
let currentRow = 0;
let currentCol = 0;
let currentGuess = '';
let isGameOver = false;

// Stats
let stats = JSON.parse(localStorage.getItem('wordle_stats') || '{"played":0,"won":0,"streak":0,"bestStreak":0}');

function saveStats(won) {
  stats.played++;
  if (won) {
    stats.won++;
    stats.streak++;
    if (stats.streak > stats.bestStreak) stats.bestStreak = stats.streak;
  } else {
    stats.streak = 0;
  }
  localStorage.setItem('wordle_stats', JSON.stringify(stats));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

// Build UI
function initBoard() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = `row-${r}`;
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

const KB_LAYOUT = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["ENTER","Z","X","C","V","B","N","M","⌫"]
];

function initKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_LAYOUT.forEach(row => {
    const r = document.createElement('div');
    r.className = 'kb-row';
    row.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'key' + (key === 'ENTER' || key === '⌫' ? ' wide' : '');
      btn.textContent = key;
      btn.id = `key-${key}`;
      btn.onclick = () => handleKey(key);
      r.appendChild(btn);
    });
    kb.appendChild(r);
  });
}

function handleKey(key) {
  initAudio();
  if (isGameOver) return;

  if (key === '⌫' || key === 'BACKSPACE') {
    if (currentCol > 0) {
      currentCol--;
      currentGuess = currentGuess.slice(0, -1);
      const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
      tile.textContent = '';
      tile.classList.remove('pop');
      playSound('key');
    }
  } else if (key === 'ENTER') {
    if (currentGuess.length !== 5) {
      showToast('Not enough letters');
      return;
    }
    submitGuess();
  } else if (/^[A-ZА-Я]$/i.test(key) && currentGuess.length < 5) {
    const letter = key.toUpperCase();
    currentGuess += letter;
    const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
    tile.textContent = letter;
    tile.classList.add('pop');
    playSound('key');
    currentCol++;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Backspace') handleKey('⌫');
  else if (e.key === 'Enter') handleKey('ENTER');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function submitGuess() {
  const guess = currentGuess;
  const target = targetWord;
  const targetArr = target.split('');
  const guessArr = guess.split('');
  const tileStates = Array(5).fill('absent');

  // Green passes
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === targetArr[i]) {
      tileStates[i] = 'correct';
      targetArr[i] = null;
    }
  }
  // Yellow passes
  for (let i = 0; i < 5; i++) {
    if (tileStates[i] === 'correct') continue;
    const matchIndex = targetArr.indexOf(guessArr[i]);
    if (matchIndex !== -1) {
      tileStates[i] = 'present';
      targetArr[matchIndex] = null;
    }
  }

  // Animate row flip
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const tile = document.getElementById(`tile-${currentRow}-${i}`);
      tile.classList.add('flip');
      tile.classList.add(tileStates[i]);
      playSound('flip');

      // Update keyboard key
      const keyBtn = document.getElementById(`key-${guessArr[i]}`);
      if (keyBtn) {
        if (tileStates[i] === 'correct') {
          keyBtn.className = 'key correct' + (keyBtn.classList.contains('wide') ? ' wide' : '');
        } else if (tileStates[i] === 'present' && !keyBtn.classList.contains('correct')) {
          keyBtn.className = 'key present' + (keyBtn.classList.contains('wide') ? ' wide' : '');
        } else if (!keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
          keyBtn.className = 'key absent' + (keyBtn.classList.contains('wide') ? ' wide' : '');
        }
      }
    }, i * 200);
  }

  setTimeout(() => {
    if (guess === target) {
      isGameOver = true;
      playSound('win');
      saveStats(true);
      showEndModal(true);
    } else if (currentRow === 5) {
      isGameOver = true;
      playSound('loss');
      saveStats(false);
      showEndModal(false);
    } else {
      currentRow++;
      currentCol = 0;
      currentGuess = '';
    }
  }, 5 * 200 + 300);
}

function showEndModal(won) {
  const modal = document.getElementById('endModal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const word = document.getElementById('modalAnswer');

  icon.textContent = won ? '🏆' : '💀';
  title.textContent = won ? 'EXCELLENT!' : 'BETTER LUCK NEXT TIME';
  word.textContent = `The word was: ${targetWord}`;

  document.getElementById('stPlayed').textContent = stats.played;
  const winRate = stats.played ? Math.round((stats.won / stats.played) * 100) : 0;
  document.getElementById('stWinRate').textContent = `${winRate}%`;
  document.getElementById('stStreak').textContent = stats.streak;
  document.getElementById('stBest').textContent = stats.bestStreak;

  modal.classList.add('show');
}

function nextGame() {
  document.getElementById('endModal').classList.remove('show');
  startNewGame();
}

function startNewGame() {
  targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
  currentRow = 0;
  currentCol = 0;
  currentGuess = '';
  isGameOver = false;
  initBoard();
  initKeyboard();
}

startNewGame();
</script>
